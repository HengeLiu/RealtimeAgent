services:
  glass-sim:
    build:
      context: ../..
      dockerfile: deploy/container-sim/Dockerfile
    command:
      - python
      - scripts/run_simulated_runtime.py
      - --runtime
      - glass
      - --device-id
      - glass-001
      - --host
      - 0.0.0.0
      - --port
      - "18081"
      - --status-dir
      - /shared/status
      - --server-ws-url
      - ws://server-sim:18083
      - --phone-ws-url
      - ws://phone-sim:18082
      - --glass-ws-url
      - ws://glass-sim:18081
    volumes:
      - container-sim-data:/shared
      - ../../testdata:/workspace/testdata:ro

  phone-sim:
    build:
      context: ../..
      dockerfile: deploy/container-sim/Dockerfile
    command:
      - python
      - scripts/run_simulated_runtime.py
      - --runtime
      - phone
      - --device-id
      - phone-001
      - --host
      - 0.0.0.0
      - --port
      - "18082"
      - --status-dir
      - /shared/status
      - --server-ws-url
      - ws://server-sim:18083
      - --phone-ws-url
      - ws://phone-sim:18082
      - --glass-ws-url
      - ws://glass-sim:18081
    volumes:
      - container-sim-data:/shared
      - ../../testdata:/workspace/testdata:ro

  server-sim:
    build:
      context: ../..
      dockerfile: deploy/container-sim/Dockerfile
    command:
      - python
      - scripts/run_simulated_runtime.py
      - --runtime
      - server
      - --device-id
      - server-main
      - --host
      - 0.0.0.0
      - --port
      - "18083"
      - --status-dir
      - /shared/status
      - --server-ws-url
      - ws://server-sim:18083
      - --phone-ws-url
      - ws://phone-sim:18082
      - --glass-ws-url
      - ws://glass-sim:18081
    volumes:
      - container-sim-data:/shared
      - ../../testdata:/workspace/testdata:ro

  find-object-runner:
    build:
      context: ../..
      dockerfile: deploy/container-sim/Dockerfile
    depends_on:
      - glass-sim
      - phone-sim
      - server-sim
    command:
      - python
      - scripts/run_container_find_object_case.py
      - --case-id
      - find_object_phone_center_001
      - --status-dir
      - /shared/status
      - --glass-ws-url
      - ws://glass-sim:18081
      - --server-ws-url
      - ws://server-sim:18083
      - --output
      - /shared/results/find_object_phone_center_001.json
    volumes:
      - container-sim-data:/shared
      - ../../testdata:/workspace/testdata:ro

volumes:
  container-sim-data:
