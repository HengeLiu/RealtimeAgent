asyncapi: 3.0.0
info:
  title: realtime-agent device protocol
  version: 0.1.0
  description: realtime-agent 端侧控制事件和多媒体 WebSocket 协议。
servers:
  local:
    host: 127.0.0.1:8765
    protocol: ws
channels:
  control:
    address: /ws/control
    messages:
      controlEvent:
        $ref: '#/components/messages/ControlEvent'
  audioInput:
    address: /ws/stream/audio/input?device_id={device_id}
    parameters:
      device_id:
        description: 已完成 control WebSocket 注册的设备 ID。
    messages:
      streamChunk:
        $ref: '#/components/messages/StreamChunk'
  audioOutput:
    address: /ws/stream/audio/output?device_id={device_id}
    parameters:
      device_id:
        description: 已完成 control WebSocket 注册的设备 ID。
    messages:
      streamChunk:
        $ref: '#/components/messages/StreamChunk'
  visualInput:
    address: /ws/stream/visual/input?device_id={device_id}
    parameters:
      device_id:
        description: 已完成 control WebSocket 注册的设备 ID。
    messages:
      streamChunk:
        $ref: '#/components/messages/StreamChunk'
operations:
  sendControlEvent:
    action: send
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/controlEvent'
  receiveControlEvent:
    action: receive
    channel:
      $ref: '#/channels/control'
    messages:
      - $ref: '#/channels/control/messages/controlEvent'
  sendAudioInputChunk:
    action: send
    channel:
      $ref: '#/channels/audioInput'
    messages:
      - $ref: '#/channels/audioInput/messages/streamChunk'
  receiveAudioOutputChunk:
    action: receive
    channel:
      $ref: '#/channels/audioOutput'
    messages:
      - $ref: '#/channels/audioOutput/messages/streamChunk'
  sendVisualInputChunk:
    action: send
    channel:
      $ref: '#/channels/visualInput'
    messages:
      - $ref: '#/channels/visualInput/messages/streamChunk'
components:
  messages:
    ControlEvent:
      name: ControlEvent
      title: 控制事件信封
      payload:
        $ref: './realtime-agent-event.schema.json'
    StreamChunk:
      name: StreamChunk
      title: stream 二进制帧
      summary: 4 字节 big-endian header 长度 + JSON header + payload bytes。
      payload:
        type: string
        format: binary
