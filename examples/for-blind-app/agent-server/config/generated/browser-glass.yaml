server_url: http://127.0.0.1:8765
user_id: user-playback-001
device_id: dev-browser-glass-001
client_type: browser-glass
auth:
  mode: disabled
supports:
  sensors:
  - type: rgb
    modes:
    - single
    - continuous
    default:
      format: jpeg
      frequency_hz: 1
      sample_count: 1
  actuators:
  - type: vibrator
    commands:
    - vibrate
audio:
  aec: browser_webrtc
  wake_word: manual
stream:
  sensor_mic:
    codec: pcm16le
    sample_rate: 16000
    channels: 1
    chunk_ms: 20
