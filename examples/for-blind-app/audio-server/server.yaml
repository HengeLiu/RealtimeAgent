app-name: "for-blind-app"

# 路径约定：默认运行产物写入当前应用目录下的 runs/。
# 如需整体迁移运行目录，只配置 paths.runtime_root。
paths: {}

server:
  host: "0.0.0.0"
  port: 8765
  public_url: "http://127.0.0.1:8765"
  log_level: "DEBUG"
  debug_api_enabled: true
  shutdown_grace_seconds: 10

auth:
  mode: "disabled"
  device_tokens: {}
  signed_token_secret_env: "AUDIO_CHAT_DEVICE_TOKEN_SECRET"
  token_clock_skew_seconds: 60

user:
  active_device_set_policy: "single"
  recent_message_limit: 200

control:
  transport: "websocket"
  heartbeat_timeout_seconds: 30
  heartbeat_check_interval_seconds: 5
  max_routes_per_device: 64
  allow_route_all: false
  route_filter_mode: "exact"
  exclude_producer_by_default: true

stream:
  transport: "websocket_binary"
  max_chunk_bytes: 1048576
  idle_timeout_seconds: 20
  default_sensor_mic:
    codec: "pcm16le"
    sample_rate: 16000
    channels: 1
    chunk_ms: 20
  default_actuator_speaker:
    codec: "pcm16le"
    sample_rate: 24000
    channels: 1
    chunk_ms: 20
  sensors:
    rgb_ttl_seconds: 30
    depth_ttl_seconds: 10
    imu_ttl_seconds: 10

audio_pipeline:
  aec: "endpoint_only"
  resample: "auto"
  volume_normalize: true
  vad: "provider"
  asr_sidecar: "disabled"
  silence_close_seconds: 15
  max_session_seconds: 0

asset:
  store_type: "filesystem"
  max_asset_bytes: 10485760
  default_ttl_seconds: 60
  request_timeout_seconds: 5
  selection_policy: "latest"

agent:
  mode: "text"
  # mode: "realtime_audio"
  realtime:
    provider: "qwen"
    model: "qwen3.5-omni-plus-realtime"
    turn_detection: "provider"
    voice: "Tina"
    prompt: "你的名字是'乐鑫'。你是盲人眼镜上的中文语音助手，能帮助盲人用户识别图片、障碍物、引导过马路等。每个用户语音输入期间，系统可能会持续附带当前视野图片。如果用户的问题明确涉及图片、眼前、前面、看到的画面、这是什么、周围有什么等视觉内容，请直接基于这些图片简短回答。如果用户要求寻找某个物体、持续观察某个目标、帮他留意某个东西在哪里，必须直接调用找物任务工具启动后台任务；工具和任务没有返回结果前，不要先播报“我要调用工具”“正在调用工具”“请稍等”，不要朗读工具名称、函数名、参数、JSON 或调用过程，也不能自行判断已经找到、编造目标位置、距离或方向。如果用户的问题不涉及视觉内容，例如看天气、看路线、看资料、看状态、计时器、提醒、闲聊，请直接回答用户问题，不要描述图片，也不要提到你收到了图片。请使用简短、口语化、直接的中文回答。必要时可以调用已提供的非视觉工具。不要输出代码块。"
    session_idle_timeout_seconds: 60
    visual_frame_interval_seconds: 1.0
    visual_frame_timeout_seconds: 1.5
    visual_frame_freshness_seconds: 0.0
    custom_adapter: ""
  text:
    provider: "dashscope-compatible"
    model: "qwen3.6-flash"
    prompt: "你的名字是'乐鑫'。你是盲人眼镜上的中文语音助手，能帮助盲人用户识别图片、障碍物、引导过马路等。当用户问题明确涉及当前画面、图片或视频，而当前消息没有附带视觉输入时，你可以调用 capture_photo 获取当前照片。capture_photo 只负责获取图片，不负责理解图片。工具返回后，系统会在下一次消息中附带刚获取的图片。图片附带后，你必须只基于本轮附带的视觉输入回答，不要引用历史图片替代当前画面。看不清、缺少关键帧或无法判断距离时，直接说明不确定，不要编造。用户要求寻找某个物体、持续观察某个目标、帮他留意某个东西在哪里时，必须调用找物任务工具启动后台任务；在工具和任务没有返回明确结果前，只能说明已开始寻找或正在识别，不能自行判断已经找到，也不能编造目标位置、距离或方向。请使用简短、口语化、直接的中文回答。必要时可以调用已提供的工具。不要输出代码块。"
    multimodal:
      enabled: true
      attach_tool_result_assets: true
      max_images_per_turn: 4
      image_freshness_seconds: 2
      max_image_base64_bytes: 7500000
      max_capture_photo_calls_per_turn: 1
      video:
        enabled: true
        prefer_native_video: true
        max_inline_bytes: 50000000
        max_duration_seconds: 120
        sample_fps: 1.0
        max_frames: 16
        frame_jpeg_quality: 85
    asr_provider: "dashscope"
    asr_model: "fun-asr-realtime"
    tts_provider: "dashscope"
    tts_model: "cosyvoice-v3-flash"
    tts_voice: "longanhuan"
    streaming_tts: true
    max_context_messages: 30
    allow_mock_fallback: false
    request_timeout_seconds: 15
    max_retries: 1

output:
  default_priority: "normal"
  default_ttl_seconds: 10
  allow_same_priority_interrupt: false
  default_on_interrupted: "drop"
  default_on_blocked: "queue"
  max_queue_size: 32

tools:
  enabled: true
  builtin_enabled: true
  discover:
    enabled: true
    packages: []
    recursive: true
    fail_fast: true
  allowlist: []
  denylist:
    - "interpret_image"
    - "interpret_current_view"
  default_timeout_seconds: 30
  allow_parallel_calls: true

tasks:
  enabled: true
  discover:
    enabled: true
    packages: []
    recursive: true
    fail_fast: true
  max_running_per_user: 16

memory:
  enabled: true
  store_type: "jsonl"
  manager:
    model: "qwen-plus"
    api_key_env: "DASHSCOPE_API_KEY"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    timeout_seconds: 5
    max_retries: 1

skill:
  enabled: false
  roots: []
  allow_tool_policy: true

mcp:
  enabled: false
  config_path: ""
  default_timeout_seconds: 30

endpoint_defaults:
  wake_word: "browser"
  aec: "browser_webrtc"

observability:
  log_timezone: "Asia/Shanghai"
  record_input_streams: true
  record_output_streams: true
  record_model_events: true
  record_control_events: true
  record_stream_events: true
  max_debug_sessions: 100
  retention_days: 7

dev_checks:
  run_package_check: true
  run_boundary_check: true
  require_recent_playback_ok: false
