mode: preview
server_url: http://127.0.0.1:8765
user_id: user-browser-glass-001
device_id: dev-python-phone-preview
name: Python 手机视频显示端
properties:
  device_role: phone
  endpoint.role.phone: true
  endpoint.role.visual_display: true
  endpoint.compute.vision: true
  actuator.display.rgb: true
  peer.video.receiver: true
peer_video:
  enabled: true
  listen_host: "0.0.0.0"
  listen_port: 19081
  public_host: "127.0.0.1"
  timeout_seconds: 30
  close_button_enabled: true
  yolo_mock:
    enabled: true
    per_frame: true
    complete_after_frames: 0
vision:
  provider: yolo
  device: auto
  frame_stride: 1
  save_annotated_frame: runs/audio-chat/python-phone/latest-yolo.jpg
  fallback_to_mock: false
  find_object:
    backend: yoloe
    model_path: /Users/elio/.cache/modelscope/hub/models/archifancy/AIGlasses_for_navigation/yoloe-11l-seg.pt
    conf: 0.20
    iou: 0.45
    imgsz: 640
    stable_hits: 2
    min_area_ratio: 0.001
  traffic_light:
    backend: yolo
    model_path: /Users/elio/.cache/modelscope/hub/models/archifancy/AIGlasses_for_navigation/trafficlight.pt
    conf: 0.25
    history_size: 5
    majority_threshold: 3
    enable_hsv_fallback: true
supports:
  sensors: []
  actuators: []
display:
  enabled: true
  backend: pyside6
  window_title: audio-chat Python Phone
  save_latest_frame: runs/audio-chat/python-phone/latest-rgb.png
  max_fps: 15
  log_limit: 200
  show_debug_events: true
