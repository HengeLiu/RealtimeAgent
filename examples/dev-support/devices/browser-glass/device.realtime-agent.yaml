$schema: ../../../../audio-server/realtime_agent/spec/realtime-agent-device.schema.json

device_id: dev-browser-glass-001
user_id: user-browser-glass-001
name: 浏览器调试设备
device_name: browser-glass
client_type: browser-glass
sdk_version: realtime-agent-browser-glass-0.1.0

runtime:
  platform: browser
  language: javascript
  version: 0.1.0

supports:
  sensors:
    - type: rgb
      modes: [single, continuous]
      default:
        format: jpeg
        frequency_hz: 1
        sample_count: 1
        duration_seconds: 0
        width: 960
        height: 540
      external:
        facing: environment
  actuators:
    - type: vibrator
      commands: [vibrate]
      default:
        default_pattern: short

properties:
  device_role: glass
  endpoint.role.glass: true
  peer.video.sender: true
  debug.manual_events: true
  debug.file_upload: true
  realtime_agent.audio_input: sensor.mic
  realtime_agent.audio_output: actuator.speaker
