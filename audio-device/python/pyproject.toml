[project]
name = "audio-chat-device"
version = "0.1.0"
description = "Python device communication SDK for audio-chat."
requires-python = ">=3.11,<3.13"
dependencies = ["aiohttp>=3.9.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["audio_chat_device*"]
