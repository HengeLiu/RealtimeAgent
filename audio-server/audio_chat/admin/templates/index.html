<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理后台</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --success-color: #10b981;
            --warning-color: #f59e0b;
            --danger-color: #ef4444;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --bg-primary: #ffffff;
            --bg-secondary: #f9fafb;
            --bg-tertiary: #f3f4f6;
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg-secondary);
            color: var(--text-primary);
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 16px;
            }
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, #8b5cf6 100%);
            color: white;
            padding: 32px;
            border-radius: var(--radius-xl);
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: var(--bg-primary);
            padding: 24px;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .stat-card h3 {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1;
        }

        .stat-card .trend {
            margin-top: 8px;
            font-size: 12px;
            color: var(--success-color);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .section {
            background: var(--bg-primary);
            border-radius: var(--radius-lg);
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .section-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--border-color);
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .tab {
            padding: 8px 16px;
            background: transparent;
            border: none;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .tab.active {
            background: var(--primary-color);
            color: white;
        }

        .tab:hover:not(.active) {
            background: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .table-container {
            overflow-x: auto;
            margin: -8px;
            padding: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th, td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background: var(--bg-tertiary);
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: sticky;
            top: 0;
        }

        tr:hover {
            background: var(--bg-secondary);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
            gap: 4px;
        }

        .badge-active {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-inactive {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-online {
            background: #d1fae5;
            color: #065f46;
        }

        .badge-offline {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        .loading {
            text-align: center;
            padding: 48px;
            color: var(--text-tertiary);
        }

        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-color);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 16px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            overflow-y: auto;
            padding: 24px;
            animation: fadeIn 0.2s ease;
        }

        .modal.active {
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--bg-primary);
            border-radius: var(--radius-xl);
            padding: 32px;
            max-width: 800px;
            width: 100%;
            margin: auto;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-tertiary);
            padding: 4px;
            line-height: 1;
            transition: color 0.2s;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .info-item {
            padding: 16px;
            background: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
        }

        .info-label {
            font-size: 12px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .devices-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        .device-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 20px;
            transition: all 0.2s ease;
        }

        .device-card:hover {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .device-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }

        .device-icon {
            font-size: 24px;
        }

        .device-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .device-id {
            font-size: 12px;
            color: var(--text-tertiary);
            font-family: monospace;
        }

        .device-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .device-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .device-label {
            color: var(--text-secondary);
        }

        .device-value {
            font-weight: 500;
            color: var(--text-primary);
        }

        .feature-list {
            list-style: none;
        }

        .feature-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.2s;
        }

        .feature-item:hover {
            background: var(--bg-secondary);
        }

        .feature-item:last-child {
            border-bottom: none;
        }

        .feature-name {
            font-weight: 500;
            color: var(--text-primary);
        }

        .feature-count {
            color: var(--primary-color);
            font-weight: 600;
            font-size: 16px;
        }

        .empty-state {
            text-align: center;
            padding: 48px;
            color: var(--text-tertiary);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        @media (max-width: 640px) {
            .header {
                padding: 24px;
            }

            .header h1 {
                font-size: 24px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .section {
                padding: 16px;
            }

            .section-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .modal-content {
                padding: 24px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .devices-grid {
                grid-template-columns: 1fr;
            }
        }
        </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>用户管理后台</h1>
            <p>实时监控用户数据和行为分析</p>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>总用户数</h3>
                <div class="value" id="totalUsers">-</div>
            </div>
            <div class="stat-card">
                <h3>日活用户 (DAU)</h3>
                <div class="value" id="dau">-</div>
            </div>
            <div class="stat-card">
                <h3>周活用户 (WAU)</h3>
                <div class="value" id="wau">-</div>
            </div>
            <div class="stat-card">
                <h3>月活用户 (MAU)</h3>
                <div class="value" id="mau">-</div>
            </div>
            <div class="stat-card">
                <h3>总事件数</h3>
                <div class="value" id="totalEvents">-</div>
            </div>
            <div class="stat-card">
                <h3>总会话数</h3>
                <div class="value" id="totalSessions">-</div>
            </div>
            <div class="stat-card">
                <h3>平均会话时长</h3>
                <div class="value" id="avgDuration">-</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2 class="section-title">用户列表</h2>
            </div>
            <div class="table-container">
                <div id="usersTable">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2 class="section-title">设备列表</h2>
                <div class="section-actions">
                    <button class="btn btn-primary btn-sm" onclick="loadAllDevices()">
                        <span>🔄</span>
                        刷新设备
                    </button>
                </div>
            </div>
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>用户ID</th>
                            <th>手机号</th>
                            <th>昵称</th>
                            <th>眼镜</th>
                            <th>手机</th>
                            <th>状态</th>
                            <th>操作</th>
                        </tr>
                    </thead>
                    <tbody id="allDevicesTable">
                        <tr><td colspan="7" class="loading">加载中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2 class="section-title">功能使用统计</h2>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="loadFeatureUsage(7)">最近 7 天</button>
                <button class="tab" onclick="loadFeatureUsage(30)">最近 30 天</button>
            </div>
            <div id="featureUsage">
                <div class="loading">加载中...</div>
            </div>
        </div>

        <div class="section">
            <div class="section-header">
                <h2 class="section-title">日活趋势</h2>
            </div>
            <div id="dauChart">
                <div class="loading">加载中...</div>
            </div>
        </div>
    </div>

    <div class="modal" id="userDetail">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">用户详情</h2>
                <button class="close-btn" onclick="closeUserDetail()">&times;</button>
            </div>
            <div id="userDetailContent"></div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;

        async function loadOverview() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/analytics/overview`);
                const data = await response.json();

                if (data.success) {
                    document.getElementById('totalUsers').textContent = data.data.total_users;
                    document.getElementById('dau').textContent = data.data.dau;
                    document.getElementById('wau').textContent = data.data.wau;
                    document.getElementById('mau').textContent = data.data.mau;
                    document.getElementById('totalEvents').textContent = data.data.total_events;
                    document.getElementById('totalSessions').textContent = data.data.total_sessions;
                    document.getElementById('avgDuration').textContent = formatDuration(data.data.avg_session_duration);
                }
            } catch (error) {
                console.error('加载概览数据失败:', error);
            }
        }

        async function loadUsers() {
            try {
                const [usersResponse, devicesResponse] = await Promise.all([
                    fetch(`${API_BASE}/api/admin/users?limit=50`),
                    fetch(`${API_BASE}/api/debug/devices`)
                ]);
                const usersData = await usersResponse.json();
                const devicesData = await devicesResponse.json();

                if (usersData.success) {
                    const devices = devicesData.devices || [];
                    const tableHTML = `
                        <table>
                            <thead>
                                <tr>
                                    <th>用户ID</th>
                                    <th>手机号</th>
                                    <th>昵称</th>
                                    <th>眼镜</th>
                                    <th>手机</th>
                                    <th>状态</th>
                                    <th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${usersData.data.users.map(user => {
                                    const userGlass = devices.find(d => d.user_id === user.user_id && d.properties?.device_role === 'glass');
                                    const userPhone = devices.find(d => d.user_id === user.user_id && d.properties?.device_role === 'phone');
                                    return `
                                    <tr>
                                        <td><code style="font-size: 12px;">${user.user_id}</code></td>
                                        <td>${maskPhone(user.phone_number)}</td>
                                        <td>${user.nickname || '-'}</td>
                                        <td>${getDeviceStatusBadge(userGlass)}</td>
                                        <td>${getDeviceStatusBadge(userPhone)}</td>
                                        <td><span class="badge badge-${user.status}">${user.status}</span></td>
                                        <td><button class="btn btn-secondary btn-sm" onclick="showUserDetail('${user.user_id}')">查看详情</button></td>
                                    </tr>
                                `}).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('usersTable').innerHTML = tableHTML;
                }
            } catch (error) {
                console.error('加载用户列表失败:', error);
                document.getElementById('usersTable').innerHTML = '<div class="error">加载失败</div>';
            }
        }

        async function loadAllDevices() {
            try {
                const response = await fetch(`${API_BASE}/api/debug/devices`);
                const data = await response.json();
                const devices = data.devices || [];

                const grouped = {};
                devices.forEach(d => {
                    if (!grouped[d.user_id]) grouped[d.user_id] = { glass: null, phone: null };
                    if (d.properties?.device_role === 'glass') grouped[d.user_id].glass = d;
                    if (d.properties?.device_role === 'phone') grouped[d.user_id].phone = d;
                });

                const html = Object.entries(grouped).map(([userId, devs]) => {
                    const glassBadge = getDeviceStatusBadge(devs.glass);
                    const phoneBadge = getDeviceStatusBadge(devs.phone);
                    const glassInfo = devs.glass ? `<code style="font-size: 11px; color: var(--text-tertiary);">${devs.glass.device_id}</code>${devs.glass.last_error ? ' ⚠️' : ''}` : '-';
                    const phoneInfo = devs.phone ? `<code style="font-size: 11px; color: var(--text-tertiary);">${devs.phone.device_id}</code>${devs.phone.last_error ? ' ⚠️' : ''}` : '-';
                    return `
                        <tr>
                            <td><code style="font-size: 12px;">${userId}</code></td>
                            <td>-</td>
                            <td>-</td>
                            <td>${glassBadge}<br><div style="margin-top: 4px;">${glassInfo}</div></td>
                            <td>${phoneBadge}<br><div style="margin-top: 4px;">${phoneInfo}</div></td>
                            <td>-</td>
                            <td><button class="btn btn-secondary btn-sm" onclick="showDeviceDetail('${userId}')">查看详情</button></td>
                        </tr>
                    `;
                }).join('');

                document.getElementById('allDevicesTable').innerHTML = html || '<tr><td colspan="7" class="empty-state"><div class="empty-state-icon">📱</div><div>暂无设备</div></td></tr>';
            } catch (error) {
                console.error('加载设备列表失败:', error);
            }
        }

        async function showDeviceDetail(userId) {
            try {
                const response = await fetch(`${API_BASE}/api/debug/devices`);
                const data = await response.json();
                const devices = (data.devices || []).filter(d => d.user_id === userId);

                const content = `
                    <div class="info-grid">
                        <div class="info-item">
                            <div class="info-label">用户ID</div>
                            <div class="info-value"><code>${userId}</code></div>
                        </div>
                    </div>
                    <h3 style="margin-top: 24px; margin-bottom: 16px; font-size: 16px; font-weight: 600;">设备列表</h3>
                    <div class="devices-grid">
                        ${devices.map(d => `
                            <div class="device-card">
                                <div class="device-header">
                                    <span class="device-icon">${d.properties?.device_role === 'glass' ? '👓' : '📱'}</span>
                                    <div>
                                        <div class="device-title">${d.properties?.device_role === 'glass' ? '眼镜' : '手机'}</div>
                                        <div class="device-id">${d.device_id}</div>
                                    </div>
                                </div>
                                <div class="device-info">
                                    <div class="device-row">
                                        <span class="device-label">状态</span>
                                        <span class="badge badge-${d.connection_state === 'online' ? 'online' : 'offline'}">
                                            <span class="badge-dot"></span>
                                            ${d.connection_state === 'online' ? '在线' : '离线'}
                                        </span>
                                    </div>
                                    <div class="device-row">
                                        <span class="device-label">最后活动</span>
                                        <span class="device-value">${d.last_seen_at ? new Date(d.last_seen_at * 1000).toLocaleString('zh-CN') : '-'}</span>
                                    </div>
                                    <div class="device-row">
                                        <span class="device-label">错误</span>
                                        <span class="device-value" style="color: ${d.last_error ? 'var(--danger-color)' : 'var(--success-color)'}">${d.last_error?.message || '无'}</span>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;

                document.getElementById('userDetailContent').innerHTML = content;
                document.getElementById('userDetail').classList.add('active');
            } catch (error) {
                console.error('加载设备详情失败:', error);
            }
        }

        function getDeviceStatusBadge(device) {
            if (!device) {
                return '<span class="badge badge-offline"><span class="badge-dot"></span>未绑定</span>';
            }
            const state = device.connection_state === 'online' ? 'online' : 'offline';
            const label = device.connection_state === 'online' ? '在线' : '离线';
            return `<span class="badge badge-${state}"><span class="badge-dot"></span>${label}</span>`;
        }

        async function loadFeatureUsage(days = 7) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/analytics/feature-usage?days=${days}`);
                const data = await response.json();

                if (data.success) {
                    const listHTML = `
                        <ul class="feature-list">
                            ${data.data.map(item => `
                                <li class="feature-item">
                                    <span class="feature-name">${item.feature_name}</span>
                                    <span class="feature-count">${item.count}</span>
                                </li>
                            `).join('')}
                        </ul>
                    `;
                    document.getElementById('featureUsage').innerHTML = listHTML;
                }
            } catch (error) {
                console.error('加载功能使用统计失败:', error);
                document.getElementById('featureUsage').innerHTML = '<div class="error">加载失败</div>';
            }
        }

        async function loadDAUChart() {
            try {
                const response = await fetch(`${API_BASE}/api/admin/analytics/dau-trend?days=30`);
                const data = await response.json();

                if (data.success) {
                    const chartHTML = `
                        <div style="height: 300px; display: flex; align-items: center; justify-content: center; color: var(--text-tertiary);">
                            日活趋势图表（待集成图表库）
                        </div>
                    `;
                    document.getElementById('dauChart').innerHTML = chartHTML;
                }
            } catch (error) {
                console.error('加载日活趋势失败:', error);
                document.getElementById('dauChart').innerHTML = '<div class="error">加载失败</div>';
            }
        }

        async function showUserDetail(userId) {
            try {
                const response = await fetch(`${API_BASE}/api/admin/users/${userId}`);
                const data = await response.json();

                if (data.success) {
                    const user = data.data;
                    const content = `
                        <div class="info-grid">
                            <div class="info-item">
                                <div class="info-label">用户ID</div>
                                <div class="info-value"><code>${user.user_id}</code></div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">手机号</div>
                                <div class="info-value">${maskPhone(user.phone_number)}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">昵称</div>
                                <div class="info-value">${user.nickname || '-'}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">状态</div>
                                <div class="info-value"><span class="badge badge-${user.status}">${user.status}</span></div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">注册时间</div>
                                <div class="info-value">${new Date(user.created_at).toLocaleString('zh-CN')}</div>
                            </div>
                            <div class="info-item">
                                <div class="info-label">最后登录</div>
                                <div class="info-value">${user.last_login ? new Date(user.last_login).toLocaleString('zh-CN') : '-'}</div>
                            </div>
                        </div>
                    `;

                    document.getElementById('userDetailContent').innerHTML = content;
                    document.getElementById('userDetail').classList.add('active');
                }
            } catch (error) {
                console.error('加载用户详情失败:', error);
            }
        }

        function closeUserDetail() {
            document.getElementById('userDetail').classList.remove('active');
        }

        function maskPhone(phone) {
            if (!phone) return '-';
            return phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');
        }

        function formatDuration(seconds) {
            if (!seconds) return '-';
            const minutes = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${minutes}分${secs}秒`;
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadOverview();
            loadUsers();
            loadAllDevices();
            loadFeatureUsage(7);
            loadDAUChart();
        });

        document.getElementById('userDetail').addEventListener('click', (e) => {
            if (e.target.id === 'userDetail') {
                closeUserDetail();
            }
        });
    </script>
</body>
</html>
