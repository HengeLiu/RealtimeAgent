# audio-chat server 配置完整示例。
#
# 使用方式：
# 1. 业务应用真正加载的文件名必须是 app 根目录下的 server.yaml。
# 2. 可以把本文件复制到 examples/for-blind-app/audio-server/server.yaml 后按需删减注释。
# 3. 密钥不要写进 YAML，统一通过环境变量传入，例如 DASHSCOPE_API_KEY。

# 应用名。未配置时，SDK 会用 server.yaml 所在目录名作为 app_name。
app-name: "for-blind-app"

# paths 控制运行产物的基础路径。
paths:
  # 运行产物根目录。缺省不写时默认使用当前 app 目录下的 runs/。
  # users、assets、memory、tasks、preflight 报告等默认会从这里派生。
  runtime_root: "runs/audio-chat"

# server 控制 HTTP / WebSocket 服务本身。
server:
  # 监听地址。仅本机测试可用 127.0.0.1；局域网端侧联调用 0.0.0.0。
  host: "0.0.0.0"
  # 监听端口。端侧 control / stream WebSocket 都会连接这个端口。
  port: 8765
  # 端侧可访问的服务地址。真机联调时应改成 Mac 或服务器的局域网 IP。
  public_url: "http://127.0.0.1:8765"
  # 全局日志级别。可选 DEBUG / INFO / WARNING / ERROR；本地开发推荐 DEBUG。
  log_level: "DEBUG"
  # 是否开启调试接口，例如 /api/debug/devices、/api/debug/playback。
  debug_api_enabled: true
  # 优雅关闭等待秒数，用于给 stream、Task、输出队列留出收尾时间。
  shutdown_grace_seconds: 10

# auth 控制端侧注册鉴权。
auth:
  # 鉴权模式。disabled 只适合本地测试；static_token 适合局域网联调；
  # signed_token 适合部署环境。
  mode: "disabled"
  # static_token 模式下的设备 token。key 是 device_id，value 是配对 token。
  # 不要提交真实 token。
  device_tokens: {}
  # signed_token 模式下读取签名密钥的环境变量名。
  signed_token_secret_env: "AUDIO_CHAT_DEVICE_TOKEN_SECRET"
  # signed_token 允许的端侧和服务端时钟偏差秒数。
  token_clock_skew_seconds: 60

# user 控制同一 user_id 下的运行态和消息历史。
user:
  # 同一个 user_id 的 active device set 策略。当前建议保持 single。
  active_device_set_policy: "single"
  # 用户消息存储。用于恢复上下文、调试和回放。
  message_store:
    # 当前常用 jsonl，便于直接查看；后续可扩展 sqlite。
    type: "jsonl"
    # 缺省不写时由 paths.runtime_root 派生为 <runtime_root>/users。
    root: "runs/audio-chat/users"
  # 每个 user_id 快速读取的最近消息条数。
  recent_message_limit: 200

# control 控制设备注册、心跳、路由订阅和控制事件分发。
control:
  # 控制信令传输协议。当前可运行实现为 websocket。
  transport: "websocket"
  # 设备心跳超时秒数。超过后服务端会认为设备离线。
  heartbeat_timeout_seconds: 30
  # 服务端检查心跳状态的间隔秒数。
  heartbeat_check_interval_seconds: 5
  # 单个设备最多注册多少条路由，防止端侧误注册过多订阅规则。
  max_routes_per_device: 64
  # 是否允许端侧订阅所有路由。生产环境建议 false。
  allow_route_all: false
  # 路由过滤模式。当前实现以 exact 为主。
  route_filter_mode: "exact"
  # 发布事件时是否默认排除事件生产者自己，避免端侧收到自己的回环事件。
  exclude_producer_by_default: true

# stream 控制输入/输出数据流的传输、默认格式和生命周期。
stream:
  # stream 传输协议。当前可运行实现为 websocket_binary。
  transport: "websocket_binary"
  # 单个 chunk 最大字节数。过大增加延迟，过小增加协议开销。
  max_chunk_bytes: 1048576
  # stream 空闲超时秒数。
  idle_timeout_seconds: 20
  # sensor.mic 默认输入格式。
  default_sensor_mic:
    # 当前音频链路默认使用小端 PCM16。
    codec: "pcm16le"
    # 麦克风输入采样率。Text ASR 和 ESP32 常用 16000。
    sample_rate: 16000
    # 声道数。当前推荐单声道。
    channels: 1
    # 每个音频 chunk 覆盖的毫秒数。
    chunk_ms: 20
  # actuator.speaker 默认输出格式。
  default_actuator_speaker:
    # 当前输出给端侧的音频编码。
    codec: "pcm16le"
    # 喇叭播放采样率。Omni 原生音频常见 24000；Text TTS 可按端侧能力调整。
    sample_rate: 24000
    # 声道数。当前推荐单声道。
    channels: 1
    # 输出 chunk 覆盖的毫秒数。
    chunk_ms: 20
  # 非音频传感器资产默认有效期。
  sensors:
    # RGB 图像资产默认 TTL。
    rgb_ttl_seconds: 30
    # 深度图资产默认 TTL。
    depth_ttl_seconds: 10
    # IMU 时间片资产默认 TTL。
    imu_ttl_seconds: 10

# audio_pipeline 控制 sensor.mic 进入 Agent Core 前后的音频处理策略。
audio_pipeline:
  # AEC 归属。当前 server 不做真正 AEC，必须由端侧负责。
  aec: "endpoint_only"
  # 重采样策略。auto 表示按模型和端侧格式自动转换；disabled 表示不转换。
  resample: "auto"
  # 是否启用音量归一化。排障原始音频问题时可临时关闭。
  volume_normalize: true
  # VAD / turn boundary 策略。realtime_audio 通常交给 provider；text 链路可由端侧或服务端辅助。
  vad: "provider"
  # 旁路 ASR 策略。Text 主链路的 ASR 由 agent.text.asr_provider 控制。
  asr_sidecar: "disabled"
  # 静默多少秒后可以关闭音频会话。
  silence_close_seconds: 15
  # 单次音频会话最长秒数；0 表示不限制。
  max_session_seconds: 0

# asset 控制 sensor.rgb、sensor.depth、sensor.imu 等资产缓存。
asset:
  # 资产存储类型。filesystem 适合本地开发；memory 适合轻量测试。
  store_type: "filesystem"
  # 资产根目录。缺省不写时由 paths.runtime_root 派生为 <runtime_root>/assets。
  root: "runs/audio-chat/assets"
  # 单个资产最大字节数。
  max_asset_bytes: 10485760
  # 默认资产 TTL 秒数。
  default_ttl_seconds: 60
  # 请求端侧上传资产时的等待超时秒数。
  request_timeout_seconds: 5
  # 多个设备返回同类资产时的选择策略。
  selection_policy: "latest"

# agent 控制 Agent Core 模式和模型 provider。
agent:
  # 模态主链路。测试文本链路时设为 text；测试 Omni 原生音频时设为 realtime_audio。
  # 当前 preflight 支持 text / realtime_audio。
  mode: "text"
  # 自定义 Agent Core 导入路径。当前内置链路不需要配置。
  custom_core: ""
  # realtime_audio 链路配置：sensor.mic -> Realtime provider -> assistant_audio.delta。
  realtime:
    # 当前可运行真实 provider 是 qwen；单元测试中也有 mock provider。
    provider: "qwen"
    # Qwen Omni Realtime 模型名。
    model: "qwen3.5-omni-plus-realtime"
    # turn detection 归属。provider 表示交给 Realtime 服务判断用户说完。
    turn_detection: "provider"
    # Omni 输出音色，取值由 provider 决定。
    voice: "Tina"
    # Realtime 会话系统指令。
    instructions: "你的名字是'乐鑫'。你是盲人眼镜上的中文语音助手，能帮助盲人用户识别图片、障碍物、引导过马路等。请使用简短、口语化、直接的中文回答。必要时可以调用已提供的工具。不要输出代码块。"
    # Realtime 会话空闲超时秒数。
    session_idle_timeout_seconds: 60
    # 自定义 realtime adapter 导入路径；provider=custom 时才需要。
    custom_adapter: ""
  # text 链路配置：sensor.mic -> ASR -> TextAgentCore -> Streaming TTS -> actuator.speaker。
  text:
    # 文本模型 provider。mock 用于本地无密钥测试；
    # dashscope-compatible 使用 DashScope OpenAI-compatible 接口；
    # openai-compatible 使用 OPENAI_API_KEY / OPENAI_BASE_URL。
    model_provider: "mock"
    # 文本模型名。DashScope 常用 qwen-plus；本地兼容服务填服务端模型名。
    model: "mock-text"
    # 文本模型系统提示词。
    system_prompt: "你的名字是'乐鑫'。你是盲人眼镜上的中文语音助手，能帮助盲人用户识别图片、障碍物、引导过马路等。请使用简短、口语化、直接的中文回答。必要时可以调用已提供的工具。不要输出代码块。"
    # ASR provider。mock 会在回放测试中使用 WAV 文件名作为转写文本；dashscope 调真实实时 ASR。
    asr_provider: "mock"
    # ASR 模型名。当前代码的 dashscope ASR provider 使用 Recognition 实时接口；
    # 配置 dashscope 时应使用 fun-asr-realtime。qwen3-asr-flash 属于非实时文件识别/HTTP 调用，不适配此路径。
    asr_model: "mock-asr"
    # TTS provider。mock 生成诊断音；dashscope 调真实 CosyVoice。
    tts_provider: "mock"
    # TTS 模型名。DashScope 常用 cosyvoice-v3-flash。
    tts_model: "mock-tts"
    # TTS 音色。DashScope 示例为 longanhuan。
    tts_voice: "mock"
    # 是否启用流式 TTS。true 可以更早产生首个音频包。
    streaming_tts: true
    # 送给文本模型的最大历史消息条数。
    max_context_messages: 30
    # 真实 provider 不可用时是否降级到 mock。联调配置建议 true；正式验证建议 false。
    allow_mock_fallback: true
    # 文本模型和 TTS 等 provider 调用超时秒数。
    request_timeout_seconds: 5
    # 真实 provider 失败后的重试次数。
    max_retries: 1

# output 控制 assistant_audio.delta / assistant_text.delta 到端侧播放的仲裁策略。
output:
  # 默认输出优先级。可选 low / normal / high / critical。
  default_priority: "normal"
  # 默认输出排队 TTL 秒数，超过还未播放则丢弃。
  default_ttl_seconds: 10
  # 同优先级是否允许打断当前播放。
  allow_same_priority_interrupt: false
  # 当前输出被更高优先级打断后的处理方式。
  default_on_interrupted: "drop"
  # 新输出被当前播放阻塞时的处理方式。
  default_on_blocked: "queue"
  # 输出队列最大长度。
  max_queue_size: 32
  # Tool 进度播报的音频策略。cached 表示使用缓存/预生成进度音。
  tool_progress_audio_mode: "cached"
  # Tool 进度播报优先级。
  tool_progress_priority: "low"
  # Tool 进度播报 TTL 秒数。
  tool_progress_ttl_seconds: 10

# tools 控制 server 侧 Tool 注册和执行。
tools:
  # 是否启用 Tool 系统。
  enabled: true
  # 是否启用 SDK 内置工具。
  builtin_enabled: true
  # 自动发现业务 Tool。
  discover:
    # true 表示扫描 packages 中继承 BaseTool 的类。
    enabled: true
    # 业务工具包列表；for-blind-app 会由 app loader 自动加入 capabilities 包。
    packages: []
    # 是否递归扫描子模块。开发者 app 建议 true。
    recursive: true
    # 自动发现失败时是否中止启动。
    fail_fast: true
  # 允许暴露给模型的工具名；空数组表示不限制。
  allowlist: []
  # 禁止暴露给模型的工具名，优先级高于 allowlist。
  denylist: []
  # 单次 Tool 调用默认超时秒数。
  default_timeout_seconds: 30
  # 是否允许并行工具调用。
  allow_parallel_calls: true

# tasks 控制 server 侧长任务。
tasks:
  # 是否启用 Task 系统。
  enabled: true
  # 自动发现业务 Task。
  discover:
    # true 表示扫描 packages 中继承 BaseTask 的类。
    enabled: true
    # 业务任务包列表；for-blind-app 会由 app loader 自动加入 capabilities 包。
    packages: []
    # 是否递归扫描子模块。开发者 app 建议 true。
    recursive: true
    # 自动发现失败时是否中止启动。
    fail_fast: true
  # 同一 user_id 下最多同时运行的任务数。
  max_running_per_user: 16
  # 任务状态存储配置。当前常用 memory；jsonl 可写入 root 指定目录。
  store:
    type: "memory"
    root: "runs/audio-chat/tasks"

# memory 控制长期记忆和系统级记忆整理。
memory:
  # 是否启用长期记忆。
  enabled: true
  # 记忆存储类型。当前常用 jsonl。
  store_type: "jsonl"
  # 记忆存储路径。缺省不写时由 paths.runtime_root 派生。
  path: "runs/audio-chat"
  # 记忆整理模型配置，和主对话文本模型独立。
  manager:
    # 记忆整理模型名。
    model: "qwen-plus"
    # API Key 环境变量名。
    api_key_env: "DASHSCOPE_API_KEY"
    # OpenAI-compatible base URL。
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    # 调用超时秒数。
    timeout_seconds: 5
    # 调用重试次数。
    max_retries: 1

# skill 控制 Skill 读取和工具策略约束。
skill:
  # 是否启用 Skill 系统。
  enabled: false
  # Skill 根目录列表。
  roots: []
  # 是否允许 Skill 调整工具可见策略。
  allow_tool_policy: true

# mcp 控制 MCP Gateway。MCP 不能直接拿设备上下文，需要通过 Tool / Task 封装。
mcp:
  # 是否启用 MCP Gateway。
  enabled: false
  # MCP 配置文件路径，支持 JSON / YAML。
  config_path: ""
  # 单次 MCP 调用默认超时秒数。
  default_timeout_seconds: 30

# endpoint_defaults 给参考端侧提供默认能力口径；真实端侧仍以注册声明为准。
endpoint_defaults:
  # 默认唤醒来源说明。浏览器参考端可填 browser。
  wake_word: "browser"
  # 默认 AEC 能力说明。浏览器参考端可填 browser_webrtc。
  aec: "browser_webrtc"
  # 默认订阅模板，端侧工具可用它快速生成控制路由。
  subscriptions:
    - event: "control.audio_session.*"
    - event: "stream.output.*"
      filter:
        stream_type: "actuator.speaker"

# observability 控制日志、调试快照和运行产物。
observability:
  # 运行产物根目录。缺省不写时由 paths.runtime_root 派生。
  runs_root: "runs/audio-chat"
  # 控制台日志时区。local 使用服务器系统时区；也可以显式设置为 Asia/Shanghai。
  log_timezone: "local"
  # 是否保存输入 stream。可能包含真实音频，正式环境谨慎开启。
  record_input_streams: true
  # 是否保存输出 stream，用于排查 TTS 和端侧播放。
  record_output_streams: true
  # 是否保存模型事件，用于排查首包延迟、tool call、text/audio delta。
  record_model_events: true
  # 是否保存控制事件。
  record_control_events: true
  # 是否保存 stream 生命周期和 chunk 元数据。
  record_stream_events: true
  # 调试会话最大保留数量。
  max_debug_sessions: 100
  # 运行产物保留天数；0 表示不自动清理。
  retention_days: 7

# dev_checks 控制本地预检和发布前检查。
dev_checks:
  # 是否执行包安装和导入检查。
  run_package_check: true
  # 是否检查 SDK 包边界。
  run_boundary_check: true
  # preflight 报告输出路径。缺省不写时由 paths.runtime_root 派生。
  report_path: "runs/audio-chat/preflight.json"
  # 是否要求最近一次 playback result.json 通过。
  require_recent_playback_ok: false
