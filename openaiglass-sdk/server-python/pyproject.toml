[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openaiglasses-sdk"
version = "0.1.0"
description = "OpenAI Glasses multi-device capability SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.25.0",
    "openai>=1.30.0,<2",
    "openai-agents>=0.3.3",
    "pydantic>=2,<3",
]

authors = [
    { name = "OpenAI Glasses Demo Contributors" },
]
keywords = ["sdk", "smart-glasses", "multi-device", "agent", "capability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
mcp = ["mcp>=1.8.0"]

[project.scripts]
openaiglass = "openaiglasses.cli:main"
"openaiglass.server.run" = "openaiglasses.cli.shortcuts:server_run"
"openaiglass.server.start" = "openaiglasses.cli.shortcuts:server_start"
"openaiglass.server.stop" = "openaiglasses.cli.shortcuts:server_stop"
"openaiglass.server.logs" = "openaiglasses.cli.shortcuts:server_logs"
"openaiglass.config.sync" = "openaiglasses.cli.shortcuts:config_sync"
"openaiglass.sdk.preflight" = "openaiglasses.cli.shortcuts:sdk_preflight"
"openaiglass.sdk.live-check" = "openaiglasses.cli.shortcuts:sdk_live_check"
"openaiglass.sdk.package-check" = "openaiglasses.cli.shortcuts:sdk_package_check"
"openaiglass.sdk.contract-tests" = "openaiglasses.cli.shortcuts:sdk_contract_tests"
"openaiglass.sdk.audio-samples" = "openaiglasses.cli.shortcuts:sdk_audio_samples"
"openaiglass.phone.open" = "openaiglasses.cli.shortcuts:phone_open"
"openaiglass.phone.build-sim" = "openaiglasses.cli.shortcuts:phone_build_sim"
"openaiglass.phone.mock" = "openaiglasses.cli.shortcuts:phone_mock"
"openaiglass.glass.start" = "openaiglasses.cli.shortcuts:glass_start"
"openaiglass.glass.build" = "openaiglasses.cli.shortcuts:glass_build"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent_core*",
    "api*",
    "app*",
    "backend_task_core*",
    "devtools*",
    "infra*",
    "openaiglasses*",
    "protocol*",
    "runtime*",
]
