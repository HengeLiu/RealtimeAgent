<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="320" viewBox="0 0 1320 320" role="img" aria-labelledby="title desc">
  <title id="title">realtime-agent brand logo</title>
  <desc id="desc">A combined realtime-agent brand logo with an abstract icon and handwritten-style wordmark.</desc>
  <defs>
    <style>
      .icon-core { fill: #1d3557; }
      .icon-node { fill: #ffffff; stroke: #172033; stroke-width: 18; }
      .icon-dot { fill: #2f80ed; }
      .word {
        font-family: "Noteworthy", "Chalkboard SE", "Arial Rounded MT Bold", "Segoe Print", cursive;
        font-size: 116px;
        font-weight: 700;
        letter-spacing: 0;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .real { fill: #2f80ed; }
      .rest { fill: #1d3557; }
    </style>
  </defs>

  <g transform="translate(42 44) scale(0.45)">
    <circle cx="190" cy="256" r="92" class="icon-core"/>
    <circle cx="190" cy="256" r="32" fill="#ffffff"/>
    <circle cx="330" cy="256" r="82" class="icon-node"/>
    <circle cx="330" cy="256" r="27" class="icon-dot"/>
  </g>

  <text x="310" y="195" class="word">
    <tspan class="real">real</tspan><tspan class="rest">time-agent</tspan>
  </text>
</svg>
