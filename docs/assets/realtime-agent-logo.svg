<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">realtime-agent logo</title>
  <desc id="desc">A minimal realtime-agent mark with a central runtime core, two endpoints, and a simple realtime loop.</desc>
  <defs>
    <style>
      .core { fill: #1d3557; }
      .node { fill: #ffffff; stroke: #172033; stroke-width: 18; }
      .dot { fill: #2f80ed; }
    </style>
  </defs>

  <circle cx="190" cy="256" r="92" class="core"/>
  <circle cx="190" cy="256" r="32" fill="#ffffff"/>

  <circle cx="330" cy="256" r="82" class="node"/>
  <circle cx="330" cy="256" r="27" class="dot"/>
</svg>
