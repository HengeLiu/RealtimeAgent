id: who_are_you
name: 你是谁呀
description: 使用音频样例触发一次普通语音对话，并检查 speaker 输出。

device:
  user_id: user-system-test
  device_id: dev-python-playback-glass-who
  name: Python 回放眼镜

inputs:
  audio:
    path: testdata/audio-sample/你是谁呀.wav
    mode: realtime_chunks
    chunk_ms: 20

expect:
  events:
    includes:
      - control.device.registered
      - control.audio_session.open.requested
      - stream.output.start.requested
  streams:
    includes:
      - sensor.mic
      - actuator.speaker
  output:
    min_audio_chunks: 1
  errors:
    disallow_system_error: true

playback:
  timeout_seconds: 30
