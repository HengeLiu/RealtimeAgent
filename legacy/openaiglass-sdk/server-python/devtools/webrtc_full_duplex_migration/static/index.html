<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Omni WebRTC Full Duplex Migration</title>
  <style>
    body {
      margin: 32px;
      max-width: 960px;
      color: #18212f;
      background: #f7f8fa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      padding: 20px;
      background: #ffffff;
      border: 1px solid #d8dee8;
      border-radius: 8px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    button {
      border: 1px solid #9aa8ba;
      background: #1f6feb;
      color: #ffffff;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 14px;
      cursor: pointer;
    }
    button.secondary {
      background: #ffffff;
      color: #18212f;
    }
    label {
      display: block;
      margin: 12px 0 4px;
      font-weight: 600;
    }
    input {
      width: 220px;
      padding: 6px 8px;
      border: 1px solid #b7c0ce;
      border-radius: 6px;
    }
    #log {
      margin-top: 16px;
      height: 440px;
      overflow: auto;
      background: #0f1722;
      color: #dbe7ff;
      padding: 12px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }
    .row {
      display: flex;
      gap: 12px;
      align-items: end;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Omni WebRTC Full Duplex Migration</h1>
    <p>这个页面用于验证浏览器 WebRTC AEC 下的全双工对话、连续对话和播放中打断。</p>
    <div class="row">
      <div>
        <label for="wsUrl">Relay WebSocket</label>
        <input id="wsUrl" value="ws://127.0.0.1:9876/ws" />
      </div>
      <div>
        <label for="gain">播放增益</label>
        <input id="gain" type="number" min="0" max="1.5" step="0.05" value="0.7" />
      </div>
      <div>
        <label for="bargeInRms">打断阈值 RMS</label>
        <input id="bargeInRms" type="number" min="0" max="1" step="0.005" value="0.035" />
      </div>
      <div>
        <label for="bargeInFrames">连续帧数</label>
        <input id="bargeInFrames" type="number" min="1" max="10" step="1" value="2" />
      </div>
      <button id="start">开始</button>
      <button id="stop" class="secondary" disabled>停止</button>
    </div>
    <div id="log"></div>
  </main>

  <script>
    const INPUT_RATE = 16000;
    const OUTPUT_RATE = 24000;
    const logEl = document.getElementById("log");
    const startButton = document.getElementById("start");
    const stopButton = document.getElementById("stop");
    let ws = null;
    let audioContext = null;
    let micStream = null;
    let source = null;
    let processor = null;
    let playbackTime = 0;
    let playbackNodes = [];
    let assistantPlaying = false;
    let bargeInCandidateFrames = 0;
    let lastBargeInAt = 0;
    let sentBytes = 0;
    let receivedBytes = 0;

    function log(line) {
      const at = new Date().toLocaleTimeString();
      logEl.textContent += `[${at}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function floatToPcm16(samples) {
      const data = new ArrayBuffer(samples.length * 2);
      const view = new DataView(data);
      for (let i = 0; i < samples.length; i += 1) {
        const value = Math.max(-1, Math.min(0.999969, samples[i]));
        view.setInt16(i * 2, value * 32767, true);
      }
      return new Uint8Array(data);
    }

    function pcm16ToFloat(bytes, gain) {
      const view = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
      const out = new Float32Array(bytes.byteLength / 2);
      for (let i = 0; i < out.length; i += 1) {
        out[i] = (view.getInt16(i * 2, true) / 32768) * gain;
      }
      return out;
    }

    function resampleLinear(input, fromRate, toRate) {
      if (fromRate === toRate) return input;
      const ratio = fromRate / toRate;
      const outLength = Math.max(1, Math.floor(input.length / ratio));
      const output = new Float32Array(outLength);
      for (let i = 0; i < outLength; i += 1) {
        const pos = i * ratio;
        const left = Math.floor(pos);
        const frac = pos - left;
        const a = input[left] || 0;
        const b = input[left + 1] || a;
        output[i] = a * (1 - frac) + b * frac;
      }
      return output;
    }

    function bytesToBase64(bytes) {
      let binary = "";
      const chunk = 0x8000;
      for (let i = 0; i < bytes.length; i += chunk) {
        binary += String.fromCharCode(...bytes.subarray(i, i + chunk));
      }
      return btoa(binary);
    }

    function base64ToBytes(text) {
      const binary = atob(text);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i += 1) {
        bytes[i] = binary.charCodeAt(i);
      }
      return bytes;
    }

    function playPcm16(base64Audio) {
      const bytes = base64ToBytes(base64Audio);
      receivedBytes += bytes.length;
      const gain = Number(document.getElementById("gain").value || "0.7");
      const samples24k = pcm16ToFloat(bytes, gain);
      const samples = resampleLinear(samples24k, OUTPUT_RATE, audioContext.sampleRate);
      const buffer = audioContext.createBuffer(1, samples.length, audioContext.sampleRate);
      buffer.copyToChannel(samples, 0);
      const node = audioContext.createBufferSource();
      node.buffer = buffer;
      node.connect(audioContext.destination);
      node.onended = () => {
        playbackNodes = playbackNodes.filter((item) => item !== node);
        if (playbackNodes.length === 0 && audioContext.currentTime >= playbackTime - 0.03) {
          assistantPlaying = false;
        }
      };
      const now = audioContext.currentTime;
      playbackTime = Math.max(playbackTime, now);
      node.start(playbackTime);
      playbackTime += buffer.duration;
      playbackNodes.push(node);
      assistantPlaying = true;
    }

    function stopLocalPlayback() {
      for (const node of playbackNodes) {
        try {
          node.stop();
        } catch (_) {
          // 节点可能已经自然结束，测试页面可以直接忽略。
        }
      }
      playbackNodes = [];
      playbackTime = audioContext.currentTime;
      assistantPlaying = false;
    }

    function rms(samples) {
      let sum = 0;
      for (let i = 0; i < samples.length; i += 1) {
        sum += samples[i] * samples[i];
      }
      return Math.sqrt(sum / Math.max(1, samples.length));
    }

    function maybeBargeIn(input) {
      if (!assistantPlaying) {
        bargeInCandidateFrames = 0;
        return;
      }
      const now = audioContext.currentTime;
      if (now - lastBargeInAt < 1.0) return;
      const level = rms(input);
      const threshold = Number(document.getElementById("bargeInRms").value || "0.035");
      const frames = Number(document.getElementById("bargeInFrames").value || "2");
      if (level >= threshold) {
        bargeInCandidateFrames += 1;
        if (bargeInCandidateFrames >= frames) {
          lastBargeInAt = now;
          bargeInCandidateFrames = 0;
          stopLocalPlayback();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: "cancel_response" }));
          }
          log(`barge-in triggered rms=${level.toFixed(4)}`);
        }
      } else {
        bargeInCandidateFrames = 0;
      }
    }

    async function start() {
      audioContext = new AudioContext();
      await audioContext.resume();
      ws = new WebSocket(document.getElementById("wsUrl").value);
      ws.onopen = () => log("relay connected");
      ws.onclose = () => log("relay closed");
      ws.onerror = (event) => log(`relay error ${event.type}`);
      ws.onmessage = (event) => {
        const message = JSON.parse(event.data);
        if (message.type === "audio") {
          playPcm16(message.audio);
          return;
        }
        log(`omni ${message.summary || message.type}`);
      };

      micStream = await navigator.mediaDevices.getUserMedia({
        audio: {
          channelCount: 1,
          echoCancellation: true,
          noiseSuppression: true,
          autoGainControl: true,
        },
        video: false,
      });
      const track = micStream.getAudioTracks()[0];
      log(`mic settings ${JSON.stringify(track.getSettings())}`);
      source = audioContext.createMediaStreamSource(micStream);
      processor = audioContext.createScriptProcessor(2048, 1, 1);
      processor.onaudioprocess = (event) => {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const input = event.inputBuffer.getChannelData(0);
        maybeBargeIn(input);
        const samples = resampleLinear(input, audioContext.sampleRate, INPUT_RATE);
        const pcm = floatToPcm16(samples);
        sentBytes += pcm.byteLength;
        ws.send(JSON.stringify({ type: "audio", audio: bytesToBase64(pcm) }));
      };
      source.connect(processor);
      processor.connect(audioContext.destination);
      startButton.disabled = true;
      stopButton.disabled = false;
      log("running with browser WebRTC echoCancellation/noiseSuppression/autoGainControl");
    }

    async function stop() {
      if (processor) processor.disconnect();
      if (source) source.disconnect();
      if (micStream) micStream.getTracks().forEach((track) => track.stop());
      if (ws) ws.close();
      if (audioContext) await audioContext.close();
      startButton.disabled = false;
      stopButton.disabled = true;
      log(`stopped sentBytes=${sentBytes} receivedBytes=${receivedBytes}`);
    }

    startButton.onclick = () => start().catch((error) => log(`start failed ${error.stack || error}`));
    stopButton.onclick = () => stop().catch((error) => log(`stop failed ${error.stack || error}`));
  </script>
</body>
</html>
