mode: register_only
server_url: http://127.0.0.1:8765
user_id: user-for-blind-app
device_id: dev-python-phone-001
supports:
  sensors:
    - type: rgb
      modes: [single, continuous]
      default:
        format: jpeg
        frequency_hz: 1
        sample_count: 1
  actuators:
    - type: vibrator
      commands: [vibrate]
