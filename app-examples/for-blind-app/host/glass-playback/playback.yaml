mode: in_process
runs_root: runs/audio-chat/for-blind-app
user_id: user-for-blind-app
device_id: dev-for-blind-glass-playback
supports:
  sensors:
    - type: rgb
      modes: [single]
      default:
        format: jpeg
        frequency_hz: 1
        sample_count: 1
subscriptions:
  - event: control.audio_session.*
  - event: stream.output.*
    filter:
      stream_type: actuator.speaker
  - event: stream.output.cancel.*
    filter:
      stream_type: actuator.speaker
  - event: stream.control.*
    filter:
      stream_type: sensor.rgb
asr_provider: mock
asr_model: mock-asr
text_model_provider: mock
text_model: mock-text
tts_provider: mock
tts_model: mock-tts
tts_voice: mock
