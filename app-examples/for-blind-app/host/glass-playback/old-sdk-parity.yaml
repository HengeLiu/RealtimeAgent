mode: in_process
runs_root: runs/audio-chat/old-sdk-parity-playback
asset_root: runs/audio-chat/old-sdk-parity-playback/assets
app_root: app-examples/for-blind-app
user_id: user-old-sdk-parity-cli
device_id: dev-old-sdk-parity-glass-playback
heading:
  degrees: 92.5
  accuracy: mock
location:
  latitude: 31.2304
  longitude: 121.4737
  accuracy_m: 5
scenario:
  actions:
    - type: call_tool
      name: capture_photo
      input:
        reason: old-sdk-parity-cli
    - type: start_task
      task_type: continuous_rgb_analyze
      input:
        frame_limit: 2
        timeout_seconds: 1
    - type: start_task
      task_type: timer
      input:
        seconds: 1
    - type: configure_stream
      stream_type: sensor.depth
      payload:
        mode: continuous
        max_samples: 2
        correlation_id: depth-cli
    - type: configure_stream
      stream_type: sensor.imu
      payload:
        mode: continuous
        max_samples: 3
        correlation_id: imu-cli
  assert:
    expected_events:
      - control.device.registered
      - stream.control.configure.requested
      - stream.output.open.requested
      - stream.output.close.requested
    expected_stream_types:
      - sensor.rgb
      - sensor.depth
      - sensor.imu
      - actuator.speaker
    expected_asset_count: 8
    expected_tool_events:
      - capture_photo
    expected_task_events:
      - continuous_rgb_analyze.frames_collected
      - timer.started
    expected_output_chunks: 1
