$schema: ../../spec/audio-chat-device.schema.json

device_id: dev-browser-glass-001
user_id: user-browser-glass-001
name: 浏览器调试设备
device_name: browser-glass
client_type: browser-glass
sdk_version: audio-chat-browser-glass-0.1.0

runtime:
  platform: browser
  language: javascript
  version: 0.1.0

supports:
  - id: sensor.mic
    modes: [continuous]
    sample_rate_hz: 48000
    channels: 1
    frequency_hz: 50
    duration_seconds: 0
    codecs: [pcm16le]
    options:
      aec: browser_webrtc
      noise_suppression: browser_webrtc
      wake: manual

  - id: sensor.rgb
    modes: [single, continuous]
    formats: [jpeg]
    frequency_hz: 1
    sample_count: 1
    duration_seconds: 0
    width: 1280
    height: 720
    options:
      facing: environment

  - id: sensor.imu
    modes: [continuous]
    frequency_hz: 30
    sample_count: 0
    duration_seconds: 0
    options:
      axes: [accel, gyro]

  - id: sensor.tof
    modes: [single, continuous]
    formats: [png]
    frequency_hz: 5
    sample_count: 1
    duration_seconds: 0
    width: 320
    height: 240
    options:
      unit: millimeter

  - id: actuator.speaker
    codecs: [pcm16le]
    sample_rates_hz: [16000, 24000]
    channels: 1

  - id: actuator.haptic
    commands: [vibrate]
    options:
      default_pattern: short

properties:
  debug.manual_events: true
  debug.file_upload: true
