server_url: http://127.0.0.1:8765
user_id: user-endpoint-001
device_id: dev-python-phone-display-001
name: Python 手机视频显示端
auth:
  mode: disabled
properties:
  endpoint.role.visual_display: true
  endpoint.compute.vision: true
  actuator.display.rgb: true
subscriptions:
  - event: stream.input.*
    filter:
      stream_type: sensor.rgb
  - event: stream.control.*
    filter:
      stream_type: sensor.rgb
  - event: control.device.command.*
display:
  enabled: true
  backend: opencv
  window_title: audio-chat python phone
  max_fps: 15
  close_on_stream_closed: false
  save_latest_frame: runs/audio-chat/python-phone/latest-rgb.jpg
