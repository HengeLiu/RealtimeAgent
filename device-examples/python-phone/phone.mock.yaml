mode: register_only
server_url: http://127.0.0.1:8765
user_id: user-endpoint-001
device_id: dev-python-phone-001
name: Python 算力模拟设备
auth:
  mode: disabled
properties:
  phone.task.find_object_phone_task: true
  phone.task.traffic_light_phone_task: true
supports:
  - id: sensor.rgb
    modes:
      - single
      - continuous
    formats:
      - jpeg
    frequency_hz: 1
    sample_count: 1
  - id: actuator.speaker
    codecs:
      - pcm16le
    sample_rates_hz:
      - 16000
      - 24000
    channels: 1
  - id: actuator.haptic
    commands:
      - vibrate
subscriptions:
  - event: stream.control.*
    filter:
      stream_type: sensor.rgb
  - event: stream.output.*
    filter:
      stream_type: actuator.speaker
  - event: stream.output.*
    filter:
      stream_type: actuator.haptic
  - event: control.device.command.*
vision_frames:
  find_object_phone_task:
    - "mock-find-object-frame"
  traffic_light_phone_task:
    - "mock-traffic-light-frame"
