mode: register_only
server_url: http://127.0.0.1:8765
user_id: user-for-blind-app
device_id: dev-python-phone-mock
supports:
  sensors:
    - type: rgb
      modes: [single, continuous]
      default:
        format: jpeg
        frequency_hz: 1
        sample_count: 1
  actuators:
    - type: vibrator
      commands: [vibrate]
subscriptions:
  - event: stream.control.*
    filter:
      stream_type: sensor.rgb
  - event: stream.output.*
    filter:
      stream_type: actuator.speaker
  - event: stream.output.*
    filter:
      stream_type: actuator.haptic
  - event: command.*
