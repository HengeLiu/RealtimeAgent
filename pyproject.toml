[project]
name = "audio-chat"
version = "0.1.0rc1"
description = "Server-side Python SDK for audio-chat stream-based voice sessions."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "dashscope>=1.25.0",
    "openai>=1.30.0,<2",
    "opencv-python>=4.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
"audio-chat.config.sync" = "audio_chat.cli.config:sync"
"audio-chat.playback.glass" = "audio_chat_python_glass.playback:main"
"audio-chat.dev.preflight" = "audio_chat.preflight:main"
"audio-chat.server.run" = "audio_chat.server:main"
"audio-chat.server.start" = "audio_chat.cli.server:start"
"audio-chat.server.stop" = "audio_chat.cli.server:stop"
"audio-chat.server.logs" = "audio_chat.cli.server:logs"
"audio-chat.sdk.package-check" = "audio_chat.cli.sdk:package_check"
"audio-chat.web.open" = "audio_chat.cli.web:open_web"
"audio-chat.ios.open" = "audio_chat.cli.ios:open_ios"
"audio-chat.ios.build-sim" = "audio_chat.cli.ios:build_sim"
"audio-chat.esp32.config" = "audio_chat.cli.esp32:config"
"audio-chat.esp32.build" = "audio_chat.cli.esp32:build"
"audio-chat.esp32.flash" = "audio_chat.cli.esp32:flash"
"audio-chat.esp32.monitor" = "audio_chat.cli.esp32:monitor"
"audio-chat.dev.live-check" = "audio_chat.preflight:live_check"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "audio-chat-sdk",
    "device-examples/python-glass",
    "device-examples/python-phone",
    "device-examples/native-esp32-glass",
]
include = [
    "audio_chat*",
    "audio_chat_python_glass*",
    "audio_chat_python_phone_mock*",
    "audio_chat_esp32_s3*",
]

[tool.setuptools.package-data]
audio_chat = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["audio-chat-sdk"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]
