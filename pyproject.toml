[project]
name = "audio-chat"
version = "0.1.0rc1"
description = "Server-side Python SDK for audio-chat stream-based voice sessions."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "dashscope>=1.25.0",
    "openai>=1.30.0,<2",
    "opencv-python>=4.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
"audio-chat.config.sync" = "audio_chat.cli.config:sync"
"audio-chat.playback.glass" = "audio_chat_python_glass.playback:main"
"audio-chat.playback-glass.run" = "audio_chat_python_playback_glass.cli:main"
"audio-chat.dev.preflight" = "audio_chat.preflight:main"
"audio-chat.server.run" = "audio_chat.server:main"
"audio-chat.server.start" = "audio_chat.cli.server:start"
"audio-chat.server.stop" = "audio_chat.cli.server:stop"
"audio-chat.server.logs" = "audio_chat.cli.server:logs"
"audio-chat.sdk.package-check" = "audio_chat.cli.sdk:package_check"
"audio-chat.device.validate" = "audio_chat.cli.device:validate"
"audio-chat.web.open" = "audio_chat.cli.web:open_web"
"audio-chat.ios.open" = "audio_chat.cli.ios:open_ios"
"audio-chat.ios.build-sim" = "audio_chat.cli.ios:build_sim"
"audio-chat.esp32.config" = "audio_chat.cli.esp32:config"
"audio-chat.esp32.build" = "audio_chat.cli.esp32:build"
"audio-chat.esp32.flash" = "audio_chat.cli.esp32:flash"
"audio-chat.esp32.monitor" = "audio_chat.cli.esp32:monitor"
"audio-chat.dev.live-check" = "audio_chat.preflight:live_check"
"audio-chat.context.inspect" = "audio_chat.cli.context:inspect"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "audio-server",
    "audio-device/python/src",
    "examples/dev-support/devices/python-glass",
    "examples/dev-support/devices/python-playback-glass",
    "examples/dev-support/devices/python-phone",
    "examples/for-blind-app/devices/native-esp32-glass",
]
include = [
    "audio_chat*",
    "audio_chat_device*",
    "audio_chat_python_glass*",
    "audio_chat_python_playback_glass*",
    "audio_chat_python_phone_mock*",
    "audio_chat_esp32_s3*",
]

[tool.setuptools.package-data]
audio_chat = ["py.typed", "spec/*.json", "spec/*.yaml", "prompts/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = [
    "audio-server",
    "audio-device/python/src",
    "examples/dev-support/devices/python-glass",
    "examples/dev-support/devices/python-playback-glass",
    "examples/dev-support/devices/python-phone",
    "examples/for-blind-app/devices/native-esp32-glass",
]
testpaths = [
    "audio-server/tests",
    "audio-device/python/tests",
    "examples/for-blind-app/tests",
    "examples/dev-support/tests",
]
addopts = "-q"
markers = [
    "protocol_spec: protocol documentation and source mapping contract tests",
    "protocol: L0 protocol contract tests",
    "sdk: L1 SDK system integration tests",
    "device_sdk: L1 Device SDK protocol contract tests",
    "interop: L1 Server SDK and Device SDK real transport interoperability tests",
    "model_provider: L2 real model provider tests",
    "app: L3 application tests",
    "replay: L3 replay tests using testdata",
    "hardware: real hardware or manual-assisted tests",
]
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]
