[project]
name = "realtime-agent"
version = "0.1.0rc1"
description = "Server-side Python SDK for realtime-agent voice and device sessions."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "dashscope>=1.25.0",
    "openai>=1.30.0,<2",
    "opencv-python>=4.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
"realtime-agent.config.sync" = "realtime_agent.cli.config:sync"
"realtime-agent.playback.glass" = "realtime_agent_python_glass.playback:main"
"realtime-agent.playback-glass.run" = "realtime_agent_python_playback_glass.cli:main"
"realtime-agent.dev.preflight" = "realtime_agent.preflight:main"
"realtime-agent.server.run" = "realtime_agent.server:main"
"realtime-agent.server.start" = "realtime_agent.cli.server:start"
"realtime-agent.server.stop" = "realtime_agent.cli.server:stop"
"realtime-agent.server.logs" = "realtime_agent.cli.server:logs"
"realtime-agent.sdk.package-check" = "realtime_agent.cli.sdk:package_check"
"realtime-agent.device.validate" = "realtime_agent.cli.device:validate"
"realtime-agent.web.open" = "realtime_agent.cli.web:open_web"
"realtime-agent.ios.open" = "realtime_agent.cli.ios:open_ios"
"realtime-agent.ios.build-sim" = "realtime_agent.cli.ios:build_sim"
"realtime-agent.esp32.config" = "realtime_agent.cli.esp32:config"
"realtime-agent.esp32.build" = "realtime_agent.cli.esp32:build"
"realtime-agent.esp32.flash" = "realtime_agent.cli.esp32:flash"
"realtime-agent.esp32.monitor" = "realtime_agent.cli.esp32:monitor"
"realtime-agent.dev.live-check" = "realtime_agent.preflight:live_check"
"realtime-agent.context.inspect" = "realtime_agent.cli.context:inspect"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
gui = [
    "pyside6>=6.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [
    "agent-server",
    "devices/python/src",
    "examples/dev-support/devices/python-glass",
    "examples/dev-support/devices/python-playback-glass",
    "examples/dev-support/devices/python-phone",
    "examples/for-blind-app/devices/native-esp32-glass",
]
include = [
    "realtime_agent*",
    "realtime_agent_device*",
    "realtime_agent_python_glass*",
    "realtime_agent_python_playback_glass*",
    "realtime_agent_python_phone_mock*",
    "realtime_agent_esp32_s3*",
]

[tool.setuptools.package-data]
realtime_agent = ["py.typed", "spec/*.json", "spec/*.yaml", "prompts/*.yaml", "prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = [
    "agent-server",
    "agent-server/protocol-tests",
    "agent-server/model-provider-tests",
    "devices/python/src",
    "examples/dev-support/devices/python-glass",
    "examples/dev-support/devices/python-playback-glass",
    "examples/dev-support/devices/python-phone",
    "examples/for-blind-app/devices/native-esp32-glass",
]
testpaths = [
    "protocol/unit-tests",
    "protocol/protocol-tests",
    "agent-server/unit-tests",
    "agent-server/protocol-tests",
    "agent-server/model-provider-tests",
    "devices/python/unit-tests",
    "devices/python/protocol-tests",
    "examples/for-blind-app/unit-tests",
    "examples/for-blind-app/app-tests",
    "examples/for-blind-app/replay-tests",
    "examples/for-blind-app/hardware-tests",
    "examples/device_demo/app-tests",
    "examples/dev-support/unit-tests",
    "examples/dev-support/app-tests",
    "examples/dev-support/replay-tests",
    "examples/dev-support/hardware-tests",
]
addopts = "-q"
markers = [
    "protocol_spec: protocol documentation and source mapping contract tests",
    "protocol: L0 protocol contract tests",
    "sdk: L1 SDK system integration tests",
    "device_sdk: L1 Device SDK protocol contract tests",
    "interop: L1 Server SDK and Device SDK real transport interoperability tests",
    "model_provider: L2 real model provider tests",
    "app: L3 application tests",
    "replay: L3 replay tests using testdata",
    "hardware: real hardware or manual-assisted tests",
]
filterwarnings = [
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]
