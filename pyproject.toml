[project]
name = "openai-glasses-navigation"
version = "0.1.0"
description = "AI智能盲人眼镜三端协同项目的参考实现与联调代码库。"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "dashscope==1.25.11",
  "fastapi==0.104.1",
  "httpx==0.28.1",
  "mediapipe==0.10.8",
  "numpy==1.24.3",
  "openai==1.3.5",
  "opencv-contrib-python==4.8.1.78",
  "opencv-python==4.8.1.78",
  "pillow==10.1.0",
  "pydub==0.25.1",
  "pygame==2.5.2",
  "python-dotenv==1.0.0",
  "python-multipart==0.0.6",
  "sounddevice==0.5.5",
  "starlette==0.27.0",
  "torch==2.0.1",
  "torchvision==0.15.2",
  "ultralytics==8.3.200",
  "uvicorn[standard]==0.24.0",
  "websockets==12.0",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
]

[tool.uv]
default-groups = ["dev"]
