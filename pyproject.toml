[project]
name = "openaiglasses-for-navigation"
version = "0.1.0"
description = "Architecture baseline for OpenAI Glasses navigation system"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.30.0,<2",
]

[tool.pytest.ini_options]
pythonpath = ["server/src"]
testpaths = ["server/test"]
addopts = "-q"
