server_url: http://127.0.0.1:8765
user_id: user-browser-glass-001
device_id: dev-browser-glass-001
name: 浏览器调试设备
client_type: browser-glass
subscriptions:
  - event: control.audio_session.*
  - event: stream.output.*
    filter:
      stream_type: actuator.speaker
  - event: stream.output.*
    filter:
      stream_type: actuator.haptic
  - event: stream.control.*
    filter:
      stream_type: sensor.rgb
properties:
  audio.aec: browser_webrtc
  audio.input.sample_rate: 16000
  audio.input.channels: 1
  audio.input.chunk_ms: 20
  audio.wake_word: manual
  camera.facing: environment
  debug.manual_events: true
  debug.file_upload: true
