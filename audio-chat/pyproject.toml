[project]
name = "audio-chat"
version = "0.1.0"
description = "Server-side Python SDK for audio-chat stream-based voice sessions."
requires-python = ">=3.11,<3.13"
dependencies = [
    "aiohttp>=3.9.0",
    "dashscope>=1.25.0",
    "openai>=1.30.0,<2",
    "pyyaml>=6.0.0",
]

[project.scripts]
"audio-chat.config.sync" = "audio_chat.cli.config:sync"
"audio-chat.phone.mock" = "audio_chat.cli.phone:mock"
"audio-chat.playback.glass" = "audio_chat.endpoints.python_playback:main"
"audio-chat.dev.preflight" = "audio_chat.preflight:main"
"audio-chat.server.run" = "audio_chat.server:main"
"audio-chat.server.start" = "audio_chat.cli.server:start"
"audio-chat.server.stop" = "audio_chat.cli.server:stop"
"audio-chat.server.logs" = "audio_chat.cli.server:logs"
"audio-chat.sdk.package-check" = "audio_chat.cli.sdk:package_check"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["server-python"]
include = ["audio_chat*"]

[tool.pytest.ini_options]
pythonpath = ["server-python"]
testpaths = ["tests"]
addopts = "-q"
