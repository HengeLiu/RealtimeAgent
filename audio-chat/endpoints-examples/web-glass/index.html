<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>audio-chat web-glass</title>
  <style>
    body { margin: 28px; max-width: 980px; color: #172033; background: #f6f8fb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { background: #fff; border: 1px solid #d8dee8; border-radius: 8px; padding: 20px; }
    h1 { margin: 0 0 8px; font-size: 24px; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 14px 0; }
    label { display: block; margin-bottom: 4px; font-weight: 600; }
    input { width: 260px; padding: 7px 9px; border: 1px solid #aab5c5; border-radius: 6px; }
    button { border: 1px solid #7d8ba1; background: #1f6feb; color: #fff; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
    button.secondary { background: #fff; color: #172033; }
    button:disabled { opacity: 0.55; cursor: not-allowed; }
    #log { height: 440px; overflow: auto; background: #0f1722; color: #dbe7ff; padding: 12px; border-radius: 6px; font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>audio-chat web-glass</h1>
    <p>参考端侧：浏览器负责麦克风采集、WebRTC AEC/NS/AGC 和本地播放，server 只接收/下发 stream。</p>
    <div class="row">
      <div><label for="serverUrl">Server URL</label><input id="serverUrl" /></div>
      <div><label for="userId">User ID</label><input id="userId" /></div>
      <div><label for="deviceId">Device ID</label><input id="deviceId" /></div>
      <button id="connect">连接并注册</button>
      <button id="wake" disabled>模拟唤醒</button>
      <button id="close" class="secondary" disabled>结束</button>
    </div>
    <div id="log"></div>
  </main>

  <script>
    const PROTOCOL_VERSION = "audio-chat.v1";
    const SERVER_PRODUCER_ID = "server-main";
    const INPUT_RATE = 16000;
    const DEFAULT_CHUNK_MS = 20;
    const MIC_CHUNK_BYTES = INPUT_RATE * DEFAULT_CHUNK_MS / 1000 * 2;
    const RGB_CAPTURE_MAX_WIDTH = 960;
    const RGB_CAPTURE_MAX_HEIGHT = 540;
    const RGB_JPEG_QUALITY = 0.78;
    const BARGE_IN_RMS_THRESHOLD = 0.055;
    const BARGE_IN_REQUIRED_FRAMES = 8;
    const BARGE_IN_MAX_PEAK = 0.72;
    const BARGE_IN_COOLDOWN_MS = 1800;
    const logEl = document.getElementById("log");
    const connectButton = document.getElementById("connect");
    const wakeButton = document.getElementById("wake");
    const closeButton = document.getElementById("close");
    const params = new URLSearchParams(window.location.search);
    document.getElementById("serverUrl").value = normalizeServerUrl(
      params.get("server_url") || defaultServerUrl(),
    );
    document.getElementById("userId").value = params.get("user_id") || "user-web-glass-001";
    document.getElementById("deviceId").value = params.get("device_id") || `dev-web-glass-${Math.random().toString(16).slice(2, 8)}`;

    let controlWs = null;
    let streamWs = null;
    let audioContext = null;
    let micStream = null;
    let cameraStream = null;
    let micSource = null;
    let processor = null;
    let sessionId = null;
    let inputStreamId = null;
    let seq = 0;
    let playbackTime = 0;
    let playbackNodes = [];
    let outputStarted = new Set();
    let outputClosed = new Set();
    let pendingOutputClose = new Map();
    let micPcmBuffer = new Uint8Array(0);
    let openingMic = false;
    let interruptSentAt = 0;
    let speechDuringPlaybackFrames = 0;
    let heartbeatTimer = null;

    function delay(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    function log(line) {
      const at = new Date().toLocaleTimeString();
      logEl.textContent += `[${at}] ${line}\n`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function defaultServerUrl() {
      if (location.protocol === "http:" || location.protocol === "https:") {
        return `${location.protocol}//${location.host}`;
      }
      return "http://127.0.0.1:8765";
    }

    function normalizeServerUrl(raw) {
      const value = String(raw || "").trim().replace(/\/$/, "");
      if (!value) return "http://127.0.0.1:8765";
      try {
        const url = new URL(value);
        if (url.hostname === "0.0.0.0" || url.hostname === "[::]" || url.hostname === "::") {
          url.hostname = "127.0.0.1";
        }
        return url.toString().replace(/\/$/, "");
      } catch (err) {
        return value;
      }
    }

    function newId(prefix) {
      return `${prefix}_${Math.random().toString(16).slice(2)}${Date.now().toString(16)}`.slice(0, prefix.length + 13);
    }

    function wsUrl(path) {
      const normalized = normalizeServerUrl(document.getElementById("serverUrl").value);
      document.getElementById("serverUrl").value = normalized;
      const raw = normalized.replace(/\/$/, "");
      return raw.replace("http://", "ws://").replace("https://", "wss://") + path;
    }

    function event(event_name, payload = {}, extra = {}) {
      return {
        version: PROTOCOL_VERSION,
        event_id: newId("evt"),
        event_name,
        timestamp_ms: Date.now(),
        user_id: document.getElementById("userId").value,
        producer_id: document.getElementById("deviceId").value,
        payload,
        ...extra,
      };
    }

    function sendEvent(item) {
      controlWs.send(JSON.stringify(item));
      log(`send ${item.event_name}`);
    }

    async function ensureStreamSocketOpen() {
      if (streamWs && streamWs.readyState === WebSocket.OPEN) return;
      if (!streamWs) throw new Error("stream websocket is not created");
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("stream websocket open timeout")), 5000);
        const previousOpen = streamWs.onopen;
        const previousError = streamWs.onerror;
        streamWs.onopen = (evt) => {
          clearTimeout(timer);
          if (previousOpen) previousOpen(evt);
          resolve();
        };
        streamWs.onerror = (evt) => {
          clearTimeout(timer);
          if (previousError) previousError(evt);
          reject(new Error("stream websocket error"));
        };
      });
    }

    function encodeStreamChunk(chunk) {
      const header = {
        version: chunk.version || PROTOCOL_VERSION,
        user_id: chunk.user_id,
        session_id: chunk.session_id,
        stream_id: chunk.stream_id,
        stream_type: chunk.stream_type,
        seq: chunk.seq,
        timestamp_ms: chunk.timestamp_ms || Date.now(),
        codec: chunk.codec || "pcm16le",
        sample_rate: chunk.sample_rate || INPUT_RATE,
        channels: chunk.channels || 1,
        duration_ms: chunk.duration_ms || DEFAULT_CHUNK_MS,
        payload_size: chunk.payload.byteLength,
        final: Boolean(chunk.final),
        metadata: chunk.metadata || {},
      };
      const headerBytes = new TextEncoder().encode(JSON.stringify(header));
      const out = new Uint8Array(4 + headerBytes.length + chunk.payload.byteLength);
      new DataView(out.buffer).setUint32(0, headerBytes.length, false);
      out.set(headerBytes, 4);
      out.set(new Uint8Array(chunk.payload), 4 + headerBytes.length);
      return out.buffer;
    }

    function decodeStreamChunk(raw) {
      const bytes = new Uint8Array(raw);
      const headerLen = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength).getUint32(0, false);
      const headerText = new TextDecoder().decode(bytes.slice(4, 4 + headerLen));
      const header = JSON.parse(headerText);
      const payload = bytes.slice(4 + headerLen);
      if (payload.byteLength !== header.payload_size) throw new Error("payload_size mismatch");
      return {...header, payload};
    }

    function floatToPcm16(samples) {
      const out = new ArrayBuffer(samples.length * 2);
      const view = new DataView(out);
      for (let i = 0; i < samples.length; i += 1) {
        const value = Math.max(-1, Math.min(0.999969, samples[i]));
        view.setInt16(i * 2, value * 32767, true);
      }
      return new Uint8Array(out);
    }

    function concatBytes(a, b) {
      const out = new Uint8Array(a.byteLength + b.byteLength);
      out.set(a, 0);
      out.set(b, a.byteLength);
      return out;
    }

    function sendMicPayload(payload) {
      streamWs.send(encodeStreamChunk({
        user_id: document.getElementById("userId").value,
        session_id: sessionId,
        stream_id: inputStreamId,
        stream_type: "sensor.mic",
        seq: seq++,
        payload,
        codec: "pcm16le",
        sample_rate: INPUT_RATE,
        channels: 1,
        duration_ms: DEFAULT_CHUNK_MS,
        final: false,
      }));
    }

    function sendFinalMicPayload() {
      if (!streamWs || streamWs.readyState !== WebSocket.OPEN || !inputStreamId || !sessionId) return;
      const payload = micPcmBuffer.byteLength > 0 ? micPcmBuffer : new Uint8Array(0);
      streamWs.send(encodeStreamChunk({
        user_id: document.getElementById("userId").value,
        session_id: sessionId,
        stream_id: inputStreamId,
        stream_type: "sensor.mic",
        seq: seq++,
        payload,
        codec: "pcm16le",
        sample_rate: INPUT_RATE,
        channels: 1,
        duration_ms: payload.byteLength > 0 ? DEFAULT_CHUNK_MS : 0,
        final: true,
        metadata: {reason: "web_glass_stop_mic"},
      }));
      log(`send final sensor.mic bytes=${payload.byteLength}`);
      micPcmBuffer = new Uint8Array(0);
    }

    function pcm16ToFloat(payload) {
      const view = new DataView(payload.buffer, payload.byteOffset, payload.byteLength);
      const out = new Float32Array(payload.byteLength / 2);
      for (let i = 0; i < out.length; i += 1) out[i] = view.getInt16(i * 2, true) / 32768;
      return out;
    }

    function resampleLinear(input, fromRate, toRate) {
      if (fromRate === toRate) return input;
      const ratio = fromRate / toRate;
      const out = new Float32Array(Math.max(1, Math.floor(input.length / ratio)));
      for (let i = 0; i < out.length; i += 1) {
        const pos = i * ratio;
        const left = Math.floor(pos);
        const frac = pos - left;
        const a = input[left] || 0;
        const b = input[left + 1] || a;
        out[i] = a * (1 - frac) + b * frac;
      }
      return out;
    }

    function audioLevel(samples) {
      let sum = 0;
      let peak = 0;
      for (let i = 0; i < samples.length; i += 1) {
        const value = Math.abs(samples[i]);
        sum += value * value;
        if (value > peak) peak = value;
      }
      return {rms: Math.sqrt(sum / Math.max(1, samples.length)), peak};
    }

    function isPlaybackActive() {
      return playbackNodes.length > 0 || (audioContext && audioContext.currentTime < playbackTime - 0.05);
    }

    function sendInterruptIfNeeded(level) {
      if (!sessionId || !inputStreamId || !isPlaybackActive()) {
        speechDuringPlaybackFrames = 0;
        return;
      }
      const looksLikeTransient = level.peak > BARGE_IN_MAX_PEAK && level.rms < 0.16;
      if (level.rms < BARGE_IN_RMS_THRESHOLD || looksLikeTransient) {
        speechDuringPlaybackFrames = 0;
        return;
      }
      speechDuringPlaybackFrames += 1;
      const now = Date.now();
      if (speechDuringPlaybackFrames < BARGE_IN_REQUIRED_FRAMES || now - interruptSentAt < BARGE_IN_COOLDOWN_MS) return;
      interruptSentAt = now;
      speechDuringPlaybackFrames = 0;
      log(`barge-in detected rms=${level.rms.toFixed(4)} peak=${level.peak.toFixed(4)}`);
      stopAllOutputPlayback("barge_in_local");
      sendEvent(event("control.user.interrupt.detected", {
        reason: "barge_in",
        rms: level.rms,
        peak: level.peak,
        required_frames: BARGE_IN_REQUIRED_FRAMES,
      }, {session_id: sessionId}));
    }

    async function connect() {
      const deviceId = document.getElementById("deviceId").value;
      const controlUrl = wsUrl("/ws/control");
      log(`connect ${controlUrl}`);
      controlWs = new WebSocket(controlUrl);
      controlWs.onmessage = (message) => handleControlEvent(JSON.parse(message.data));
      controlWs.onerror = () => log("control ws error");
      controlWs.onclose = (evt) => log(`control ws closed code=${evt.code} reason=${evt.reason || "-"}`);
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("control websocket open timeout")), 5000);
        controlWs.onopen = () => {
          clearTimeout(timer);
          log("control ws open");
          resolve();
        };
        controlWs.onerror = () => {
          clearTimeout(timer);
          log("control ws error");
          reject(new Error("control websocket error"));
        };
      });
      sendEvent(event("control.device.register.requested", {
        device_id: deviceId,
        name: "浏览器设备示例",
        device_name: "web-glass",
        client_type: "web-glass",
        sdk_version: "audio-chat-web-glass-0.1.0",
        auth: {mode: "disabled"},
        properties: {
          "audio.aec": "browser_webrtc",
          "audio.wake_word": "manual",
        },
        subscriptions: [
          {event: "control.audio_session.*"},
          {event: "stream.output.*", filter: {stream_type: "actuator.speaker"}},
          {event: "stream.control.*", filter: {stream_type: "sensor.rgb"}},
        ],
      }));
    }

    function startHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => {
        if (!controlWs || controlWs.readyState !== WebSocket.OPEN) return;
        sendEvent(event("control.device.heartbeat.received", {
          connection_state: "online",
          client_type: "web-glass",
        }));
      }, 10000);
    }

    async function handleControlEvent(item) {
      log(`recv ${item.event_name}`);
      if (item.event_name === "control.device.registered") {
        wakeButton.disabled = false;
        connectButton.disabled = true;
        const streamUrl = wsUrl(`/ws/stream?device_id=${document.getElementById("deviceId").value}`);
        log(`connect ${streamUrl}`);
        streamWs = new WebSocket(streamUrl);
        streamWs.binaryType = "arraybuffer";
        streamWs.onmessage = (message) => {
          if (typeof message.data !== "string") handleStreamChunk(decodeStreamChunk(message.data));
          else log(`stream text ${message.data}`);
        };
        streamWs.onopen = () => log("stream ws open");
        streamWs.onclose = (evt) => log(`stream ws closed code=${evt.code} reason=${evt.reason || "-"}`);
        streamWs.onerror = () => log("stream ws error");
        log(`registered connection_id=${item.payload.connection_id}`);
        startHeartbeat();
      } else if (item.event_name === "control.audio_session.open.requested") {
        if (inputStreamId || openingMic) {
          log("audio session already active; ignore duplicate open request");
          return;
        }
        sessionId = item.session_id;
        sendEvent(event("control.audio_session.opened", {reason: "web_glass_opened"}, {session_id: sessionId}));
        await openMicStream();
      } else if (item.event_name === "stream.output.close.requested") {
        pendingOutputClose.set(item.stream_id, item);
        closeOutputWhenDrained(item.stream_id);
      } else if (item.event_name === "stream.control.configure.requested" && item.stream_type === "sensor.rgb") {
        await captureRgbAsset(item);
      } else if (item.event_name === "stream.output.cancel.requested" || item.event_name === "stream.output.cancelled") {
        stopOutputPlayback(item.stream_id, "server_cancelled");
      } else if (item.event_name === "control.audio_session.close.requested") {
        await stopMic();
        sendEvent(event("control.audio_session.closed", {reason: "web_glass_closed"}, {session_id: item.session_id}));
      }
    }

    async function captureRgbAsset(item) {
      const requestId = item.payload && item.payload.request_id;
      const rgbStreamId = newId("stream_rgb");
      try {
        await ensureStreamSocketOpen();
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          throw new Error("browser camera API unavailable");
        }
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: {facingMode: "environment", width: {ideal: RGB_CAPTURE_MAX_WIDTH}, height: {ideal: RGB_CAPTURE_MAX_HEIGHT}},
          audio: false,
        });
        const track = cameraStream.getVideoTracks()[0];
        log(`camera settings ${JSON.stringify(track.getSettings())}`);
        const image = await captureJpegFrame(cameraStream);
        sendEvent(event("stream.input.opened", {
          stream_type: "sensor.rgb",
          format: {codec: "jpeg", sample_rate: 1, channels: 1, chunk_ms: 1},
          request_id: requestId,
        }, {session_id: item.session_id || sessionId, stream_id: rgbStreamId, stream_type: "sensor.rgb"}));
        await delay(120);
        streamWs.send(encodeStreamChunk({
          user_id: document.getElementById("userId").value,
          session_id: item.session_id || sessionId,
          stream_id: rgbStreamId,
          stream_type: "sensor.rgb",
          seq: 0,
          payload: image.bytes,
          codec: "jpeg",
          sample_rate: 1,
          channels: 1,
          duration_ms: 1,
          final: true,
          metadata: {
            request_id: requestId,
            width: image.width,
            height: image.height,
            reason: (item.payload && item.payload.reason) || "capture_photo",
          },
        }));
        sendEvent(event("stream.input.closed", {
          stream_type: "sensor.rgb",
          reason: "single_frame_uploaded",
          request_id: requestId,
        }, {session_id: item.session_id || sessionId, stream_id: rgbStreamId, stream_type: "sensor.rgb"}));
        log(`send sensor.rgb jpeg bytes=${image.bytes.byteLength} request_id=${requestId || "-"}`);
      } catch (err) {
        log(`capture sensor.rgb failed: ${err.message}`);
        sendEvent(event("stream.input.closed", {
          stream_type: "sensor.rgb",
          reason: "capture_failed",
          error: err.message,
          request_id: requestId,
        }, {session_id: item.session_id || sessionId, stream_id: rgbStreamId, stream_type: "sensor.rgb"}));
      } finally {
        if (cameraStream) cameraStream.getTracks().forEach((track) => track.stop());
        cameraStream = null;
      }
    }

    async function captureJpegFrame(stream) {
      const video = document.createElement("video");
      video.muted = true;
      video.playsInline = true;
      video.srcObject = stream;
      await new Promise((resolve, reject) => {
        const timer = setTimeout(() => reject(new Error("camera frame timeout")), 3000);
        video.onloadedmetadata = () => {
          clearTimeout(timer);
          resolve();
        };
      });
      await video.play();
      await delay(150);
      const settings = stream.getVideoTracks()[0].getSettings();
      const sourceWidth = video.videoWidth || settings.width || 640;
      const sourceHeight = video.videoHeight || settings.height || 480;
      const scale = Math.min(1, RGB_CAPTURE_MAX_WIDTH / sourceWidth, RGB_CAPTURE_MAX_HEIGHT / sourceHeight);
      const width = Math.max(1, Math.round(sourceWidth * scale));
      const height = Math.max(1, Math.round(sourceHeight * scale));
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, width, height);
      video.pause();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", RGB_JPEG_QUALITY));
      if (!blob) throw new Error("jpeg encode failed");
      return {bytes: new Uint8Array(await blob.arrayBuffer()), width, height};
    }

    async function openMicStream() {
      if (openingMic || inputStreamId) return;
      openingMic = true;
      audioContext = audioContext || new AudioContext();
      await audioContext.resume();
      try {
        await ensureStreamSocketOpen();
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true,
          },
        });
        const track = micStream.getAudioTracks()[0];
        log(`mic settings ${JSON.stringify(track.getSettings())}`);
        inputStreamId = newId("stream_in");
        seq = 0;
        micPcmBuffer = new Uint8Array(0);
        sendEvent(event("stream.input.opened", {
          stream_type: "sensor.mic",
          format: {codec: "pcm16le", sample_rate: INPUT_RATE, channels: 1, chunk_ms: DEFAULT_CHUNK_MS},
        }, {session_id: sessionId, stream_id: inputStreamId, stream_type: "sensor.mic"}));
        await delay(120);
        micSource = audioContext.createMediaStreamSource(micStream);
        processor = audioContext.createScriptProcessor(2048, 1, 1);
        processor.onaudioprocess = (evt) => {
          if (!streamWs || streamWs.readyState !== WebSocket.OPEN || !inputStreamId) return;
          const input = evt.inputBuffer.getChannelData(0);
          sendInterruptIfNeeded(audioLevel(input));
          const pcm16 = floatToPcm16(resampleLinear(input, audioContext.sampleRate, INPUT_RATE));
          micPcmBuffer = concatBytes(micPcmBuffer, pcm16);
          while (micPcmBuffer.byteLength >= MIC_CHUNK_BYTES) {
            sendMicPayload(micPcmBuffer.slice(0, MIC_CHUNK_BYTES));
            micPcmBuffer = micPcmBuffer.slice(MIC_CHUNK_BYTES);
          }
        };
        micSource.connect(processor);
        processor.connect(audioContext.destination);
        closeButton.disabled = false;
      } finally {
        openingMic = false;
      }
    }

    function handleStreamChunk(chunk) {
      if (chunk.stream_type !== "actuator.speaker") return;
      const durationMs = Math.round((chunk.payload.byteLength / 2) / (chunk.sample_rate || INPUT_RATE) * 1000);
      log(`recv audio chunk bytes=${chunk.payload.byteLength} sample_rate=${chunk.sample_rate || INPUT_RATE} duration_ms=${durationMs}`);
      if (!outputStarted.has(chunk.stream_id)) {
        outputStarted.add(chunk.stream_id);
        sendEvent(event("stream.output.started", {stream_type: "actuator.speaker"}, {
          session_id: chunk.session_id, stream_id: chunk.stream_id, stream_type: chunk.stream_type,
        }));
      }
      playPcm16(chunk);
    }

    function playPcm16(chunk) {
      const samples = resampleLinear(pcm16ToFloat(chunk.payload), chunk.sample_rate || INPUT_RATE, audioContext.sampleRate);
      const buffer = audioContext.createBuffer(1, samples.length, audioContext.sampleRate);
      buffer.copyToChannel(samples, 0);
      const node = audioContext.createBufferSource();
      node.buffer = buffer;
      const gain = audioContext.createGain();
      gain.gain.value = 1.0;
      node.connect(gain);
      gain.connect(audioContext.destination);
      node.onended = () => {
        playbackNodes = playbackNodes.filter((item) => item.node !== node);
        closeOutputWhenDrained(chunk.stream_id);
      };
      playbackTime = Math.max(playbackTime, audioContext.currentTime);
      node.start(playbackTime);
      playbackTime += buffer.duration;
      playbackNodes.push({node, streamId: chunk.stream_id});
    }

    function closeOutputWhenDrained(streamId) {
      const request = pendingOutputClose.get(streamId);
      if (!outputStarted.has(streamId)) return;
      const streamHasNodes = playbackNodes.some((item) => item.streamId === streamId);
      if (!request || streamHasNodes || audioContext.currentTime < playbackTime - 0.03) return;
      pendingOutputClose.delete(streamId);
      if (outputClosed.has(streamId)) return;
      outputClosed.add(streamId);
      sendEvent(event("stream.output.finished", {stream_type: "actuator.speaker"}, {
        session_id: request.session_id, stream_id: streamId, stream_type: "actuator.speaker",
      }));
      sendEvent(event("stream.output.closed", {stream_type: "actuator.speaker", reason: "playback_drained"}, {
        session_id: request.session_id, stream_id: streamId, stream_type: "actuator.speaker",
      }));
    }

    function stopOutputPlayback(streamId, reason) {
      const targetNodes = playbackNodes.filter((item) => item.streamId === streamId);
      for (const item of targetNodes) {
        try { item.node.onended = null; item.node.stop(); } catch (_) {}
      }
      playbackNodes = playbackNodes.filter((item) => item.streamId !== streamId);
      pendingOutputClose.delete(streamId);
      if (playbackNodes.length === 0 && audioContext) playbackTime = audioContext.currentTime;
      if (outputClosed.has(streamId)) return;
      outputClosed.add(streamId);
      sendEvent(event("stream.output.closed", {stream_type: "actuator.speaker", reason}, {
        session_id: sessionId, stream_id: streamId, stream_type: "actuator.speaker",
      }));
    }

    function stopAllOutputPlayback(reason) {
      const streamIds = Array.from(new Set(playbackNodes.map((item) => item.streamId)));
      for (const streamId of streamIds) stopOutputPlayback(streamId, reason);
    }

    async function stopMic() {
      if (processor) processor.disconnect();
      if (micSource) micSource.disconnect();
      sendFinalMicPayload();
      if (micStream) micStream.getTracks().forEach((track) => track.stop());
      if (inputStreamId) {
        sendEvent(event("stream.input.closed", {stream_type: "sensor.mic", reason: "web_glass_closed"}, {
          session_id: sessionId, stream_id: inputStreamId, stream_type: "sensor.mic",
        }));
      }
      processor = null; micSource = null; micStream = null; inputStreamId = null; micPcmBuffer = new Uint8Array(0);
      closeButton.disabled = true;
      wakeButton.disabled = false;
    }

    connectButton.onclick = () => {
      connect().catch((err) => log(`connect failed: ${err.message}`));
    };
    wakeButton.onclick = () => {
      wakeButton.disabled = true;
      sendEvent(event("control.user.wake.detected", {wake_source: "web_glass_button"}));
    };
    closeButton.onclick = async () => {
      await stopMic();
      await delay(300);
      sendEvent(event("control.user.dialog.close.requested", {
        reason: "web_glass_button",
        close_mode: "close_after_reply",
      }, {session_id: sessionId}));
    };

    window.__audioChatWebGlassTest = {encodeStreamChunk, decodeStreamChunk};
  </script>
</body>
</html>
