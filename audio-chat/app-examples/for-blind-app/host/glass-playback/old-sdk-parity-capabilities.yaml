mode: "in_process"
runs_root: "runs/audio-chat/for-blind-app-playback"
asset_root: "runs/audio-chat/for-blind-app-playback/assets"
app_root: "examples/for-blind-app"
mcp_enabled: true
mcp_config_path: "examples/for-blind-app/config/mcp.yaml"
user_id: "user-for-blind-playback"
device_id: "dev-for-blind-playback"

sensor_profiles:
  sensor.rgb:
    codec: "jpeg"
    sample_rate: 2
    channels: 1
    chunk_ms: 1
    payloads:
      - "hex:ffd866696e642d6f626a6563742d6672616d65ffd9"
      - "hex:ffd8747261666669632d6c696768742d6672616d65ffd9"
      - "hex:ffd86e617669676174696f6e2d6672616d65ffd9"

scenario:
  actions:
    - type: "call_tool"
      name: "find_object_capture"
      input:
        object_name: "手机"
        timeout_seconds: 2
    - type: "call_tool"
      name: "start_find_object"
      input:
        object_name: "手机"
        frame_limit: 2
        timeout_seconds: 2
    - type: "call_tool"
      name: "start_traffic_light"
      input:
        expected_state: "green"
        frame_limit: 2
        timeout_seconds: 2
    - type: "call_tool"
      name: "prepare_navigation"
      input:
        origin: "当前位置"
        destination: "盲人服务中心"
    - type: "call_tool"
      name: "start_navigation"
      input:
        destination: "盲人服务中心"
        events:
          - "deviation"
          - "near_destination"
          - "visual_confirmed"
    - type: "call_tool"
      name: "search_web"
      input:
        query: "盲人导航安全提示"
    - type: "call_tool"
      name: "timer"
      input:
        action: "create"
        seconds: 0
        auto_fire: true
  assert:
    expected_events:
      - "control.device.registered"
      - "stream.control.configure.requested"
    expected_stream_types:
      - "sensor.rgb"
      - "actuator.speaker"
    expected_tool_events:
      - "find_object_capture"
      - "start_find_object"
      - "start_traffic_light"
      - "prepare_navigation"
      - "start_navigation"
      - "search_web"
      - "timer"
    expected_task_events:
      - "find_object.found"
      - "traffic_light.state_detected"
      - "navigation.deviation_detected"
      - "navigation.near_destination"
      - "navigation.visual_confirmed"
      - "timer.due"
    expected_asset_count: 6
    expected_output_chunks: 5
